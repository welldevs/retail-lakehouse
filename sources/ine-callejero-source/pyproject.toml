[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ine-callejero-source"
version = "1.0.0"
description = "INE Callejero Source: official geography (census sections, population nuclei, streets, street segments with postal code) ingested from manually downloaded files"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the package uses only the standard library.
dependencies = []

[project.scripts]
ine-callejero-source = "ine_callejero_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
