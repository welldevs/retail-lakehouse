[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ine-population-source"
version = "1.0.0"
description = "INE population Source (Tempus3): inhabitants by province in partitioned snapshots"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the package uses only the standard library.
dependencies = []

[project.scripts]
ine-population-source = "ine_population_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
