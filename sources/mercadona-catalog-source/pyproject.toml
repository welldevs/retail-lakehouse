[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadona-catalog-source"
version = "1.0.0"
description = "Mercadona catalog Source: product, category and price in partitioned snapshots"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the package uses only the standard library.
dependencies = []

[project.scripts]
mercadona-catalog-source = "mercadona_catalog_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
