[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulated-oltp-source"
version = "1.0.0"
description = "Simulated OLTP Source: synthetic customers with real Callejero addresses and real INE demographics"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the package uses only the standard library. The
# geographic/demographic reference arrives as flat JSON, never via a Lakehouse connection.
dependencies = []

[project.scripts]
simulated-oltp-source = "simulated_oltp_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
