[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulated-orders-source"
version = "1.0.0"
description = "Simulated orders Source: event log with real customer, product and price"
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the package uses only the standard library. Customer, catalog,
# price calendar and premises arrive as flat JSON, never through a Lakehouse connection.
# The broker and the OLTP exist ONE LEVEL FURTHER, on the platform side.
dependencies = []

[project.scripts]
simulated-orders-source = "simulated_orders_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
