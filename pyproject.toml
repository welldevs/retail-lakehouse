[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadona-catalog-source"
version = "1.0.0"
description = "Source de catalogo da Mercadona: produto, categoria e preco em snapshots particionados"
readme = "README.md"
requires-python = ">=3.12"
# Sem dependencias de runtime: o pacote usa apenas a biblioteca padrao.
dependencies = []

[project.scripts]
mercadona-catalog-source = "mercadona_catalog_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
