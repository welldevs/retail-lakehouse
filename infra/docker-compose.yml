# Local platform infra: object storage + Airflow (LocalExecutor) and, by profile, the stream
# plane (OLTP + Kafka), the Postgres warehouse and Spark.
#
# MinIO and Postgres are the only stateful services. The `mc` container creates the
# buckets and exits: the host has no `mc` binary, and depending on a local install to
# prepare the bucket would make `make up` non-reproducible.
#
# NO CODE GOES INTO THE IMAGE. The repository is mounted at /opt/retail-lakehouse and
# reached through PYTHONPATH, so that editing a dbt model or a platform module does not
# require a rebuild. See infra/Dockerfile.airflow.

name: retail-lakehouse

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/Dockerfile.airflow
  image: retail-lakehouse/airflow:2.10.5
  # Runs with the host UID so that files the DAG writes under data/ are not owned
  # by 50000 in the checkout. AIRFLOW_UID comes from .env.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/retail-lakehouse/orchestration/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env — run `make secrets`}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env — run `make secrets`}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    # Where the DAG finds the two runtimes. The Source runs on the Airflow interpreter
    # (dependencies = [], nothing to conflict); the platform on the image's isolated venv.
    RETAIL_REPO_ROOT: /opt/retail-lakehouse
    RETAIL_SOURCE_PYTHON: python3
    RETAIL_PLATFORM_PYTHON: /opt/platform-venv/bin/python
    RETAIL_DBT: /opt/platform-venv/bin/dbt
    # Same list as INE_TABLES in the root Makefile — without it the DAG would fall back to
    # the file's own default (only 31304) and silently diverge from `make ine-refresh`.
    RETAIL_INE_TABLES: "31304,29005"
    # Same for the timeout: 31304 returns 264 MB and 29005 another 125 MB in a single GET, and
    # the Source's generic default (30s) stalls at that volume. Same values as the Makefile.
    RETAIL_INE_TIMEOUT: "240"
    RETAIL_INE_MAX_RETRIES: "3"

    # INSIDE THE COMPOSE NETWORK THE ENDPOINT IS `minio`, NOT `localhost`. These variables
    # override the mounted .env — config.load_dotenv() does not override what is already in
    # the environment, precisely so that this case works.
    S3_ENDPOINT: http://minio:9000
    S3_ENDPOINT_HOST: minio:9000
    # Same reason, for the orders OLTP: inside the network the host is `oltp-postgres`, and the
    # service only exists under the `stream` profile. A DAG that depends on it fails to connect
    # with an actionable message — not a timeout — when `make stream-up` has not run.
    OLTP_DSN: postgresql://oltp:oltp@oltp-postgres:5432/oltp
    PROJECTION_DSN: postgresql://oltp:oltp@oltp-postgres:5432/projection
    # THE ICEBERG CATALOG NEEDS ITS OWN ADDRESS, and its absence was silent for
    # three days. `orders_projection.catalog()` falls back to a default `localhost:5433` that is
    # only valid on the host; inside the container `localhost` is the container itself, so the
    # connection failed and `silver_live_order_state` stayed permanently out of the build.
    #
    # Without this line nothing FAILS — the gate just excludes the model and the build goes green
    # with one table fewer, which is the worst kind of success. With it, Airflow builds the
    # projection when `make stream-up` is running and excludes it when it is not, which is the
    # difference between "cannot" and "did not try".
    #
    # `postgresql+psycopg://` and not `postgresql://`: SqlCatalog uses SQLAlchemy, and without
    # the explicit driver it looks for psycopg2, which is not installed (the platform uses
    # psycopg 3).
    ICEBERG_CATALOG_URI: postgresql+psycopg://oltp:oltp@oltp-postgres:5432/iceberg_catalog
    KAFKA_BOOTSTRAP: kafka:19092
    # SAME REASON as the OLTP above: inside the network the Postgres warehouse host is
    # `warehouse-postgres`, on INTERNAL port 5432 — the :5434 in .env is the host mapping,
    # and is only valid outside compose. `warehouse_load` (the DAG) is the only
    # consumer of this address from inside the container; see DECISIONS.md CR-007.
    WAREHOUSE_PG_HOST: warehouse-postgres
    WAREHOUSE_PG_PORT: "5432"
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    RAW_BUCKET: ${RAW_BUCKET:-retail-raw}
    LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-retail-lakehouse}
    # INSIDE the container, NOT in the mounted repository. DuckDB is single-writer: if the
    # orchestrator used the same file a person opens in DBeaver, a forgotten window
    # would bring down the DAG's `silver`. The file is disposable state — the data is the
    # parquet in object storage — so living in the container's ephemeral layer is correct.
    DUCKDB_PATH: /opt/airflow/retail.duckdb
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}

    # Where the Snowflake connector looks for config.toml. Pointed at the SAME path as the
    # host (see the mount below), not at /home/airflow/.snowflake, so that
    # `private_key_file` in config.toml and `SNOWFLAKE_PRIVATE_KEY_PATH` in .env.snowflake
    # resolve identically inside and outside the container — no path needs to be rewritten
    # anywhere.
    SNOWFLAKE_HOME: ${HOME}/.snowflake

  # The Snowflake account identity, if the file exists. `required: false` is what keeps
  # the Lakehouse half independent: with no Snowflake account, `make up` and the DAGs of the
  # five sources start just the same — only `warehouse_load` would have no way to authenticate.
  #
  # Why env_file and not `environment:`: in the map block, a missing variable becomes
  # PRESENT AND EMPTY in the container, and `env_var('SNOWFLAKE_ACCOUNT')` without a default
  # returns the empty value instead of aborting — dbt would die with "'account' is a required
  # property" instead of saying which variable is missing. Same trap documented in the Makefile.
  env_file:
    - path: ../.env.snowflake
      required: false

  volumes:
    # Repository mounted read-write: the DAG writes the snapshots to data/.
    - ../:/opt/retail-lakehouse
    - airflow-logs:/opt/airflow/logs
    # THE PRIVATE KEY, READ-ONLY, AT THE SAME PATH AS THE HOST. Authentication is by key
    # pair — the only method that works for a DAG, which can neither open a browser nor
    # type a password. Without this mount, `load_stage` and `build_gold_and_mart` have no way
    # to authenticate, however many dependencies the image has.
    #
    # `:ro` is deliberate: the orchestrator reads the key and never rewrites it. The container
    # runs as AIRFLOW_UID (the host uid), which owns the mode-600 file — no permission
    # needs to be loosened for this to work.
    - ${HOME}/.snowflake:${HOME}/.snowflake:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # pgsty/*, not minio/*: the official images stopped being publicly pullable (Docker Hub
  # and quay.io answer 401), which broke CI's `make up` on any machine without a cache.
  # Same MinIO binary, community-built. PINNED: `latest` is how that break arrived silently.
  # See DECISIONS.md § "CR-015".
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: retail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # BIND_ADDR=127.0.0.1 by default: the stack has development credentials
    # (minioadmin/minioadmin) and must NOT listen on the network. To expose it
    # deliberately, set BIND_ADDR=0.0.0.0 and change the credentials first.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` ships inside the server image (verified); `mc ready` is the official
      # check and covers disk+quorum, not just the process being up.
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Creates the buckets and exits. `versioning` on the RAW bucket: a landed partition is never
  # silently overwritten, mirroring the immutability the Source guarantees on disk.
  mc:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    container_name: retail-mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RAW_BUCKET: ${RAW_BUCKET:-retail-raw}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-retail-lakehouse}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$RAW_BUCKET"
        mc mb --ignore-existing "local/$$LAKEHOUSE_BUCKET"
        mc version enable "local/$$RAW_BUCKET"
        echo "buckets ready:"
        mc ls local

  # Airflow metadata — only that. The other two Postgres are the simulated OLTP and the warehouse.
  airflow-postgres:
    image: postgres:16-alpine
    container_name: retail-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # THE ORDERS OLTP. A database SEPARATE from the Airflow metadata, and not for tidiness:
  #
  #   - it is a MODELED component of the simulation, not orchestrator infrastructure. Restarting
  #     the OLTP to exercise a failure must not mean restarting Airflow's brain;
  #   - it needs its own `wal_level=logical`, which requires a restart and affects the whole server;
  #   - the outbox is the only data in this platform that is NOT derivable from elsewhere in
  #     seconds, so it deserves a volume with its own name and its own lifecycle.
  #
  # `profiles: [stream]` keeps the README promise: `make up` starts only the data plane.
  # This service only exists after `make stream-up`.
  oltp-postgres:
    image: postgres:16-alpine
    container_name: retail-oltp-postgres
    profiles: ["stream"]
    environment:
      POSTGRES_USER: oltp
      POSTGRES_PASSWORD: oltp
      POSTGRES_DB: oltp
    # `wal_level=logical` is not used by the outbox — the poller reads the table, not the WAL. It
    # is here because it is the ONLY setting that requires a server restart: leaving it on
    # from the start is what allows plugging in Debezium (Milestone 4b) without taking the
    # database down and without losing what is already in the outbox. Cost: a few more bytes
    # per write in the WAL.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OLTP_PORT:-5433}:5432"
    volumes:
      - oltp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oltp", "-d", "oltp"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # DEFAULT WAREHOUSE since CR-007. It was born as a second target, when the Snowflake account
  # was a trial with a deadline, to prove that the models/warehouse/ tree switches ENGINE and
  # not just account; Snowflake (external, outside this compose) remains optional. See DECISIONS.md.
  #
  # A DEDICATED SERVICE, not one more database inside `oltp-postgres`: that one is the
  # SIMULATED OLTP (plus the Iceberg catalog), a MODELED component of the simulation. Mixing the
  # analytical warehouse role in there would conflate two different lifecycles and one day
  # would require restarting one to work on the other.
  #
  # ITS OWN PROFILE (`warehouse-postgres`), not `stream`: `make up` still starts only the
  # data plane, and this container starts with `make warehouse-postgres-up` — the warehouse
  # is a stage after Silver, not part of the data plane.
  warehouse-postgres:
    image: postgres:16-alpine
    container_name: retail-warehouse-postgres
    profiles: ["warehouse-postgres"]
    environment:
      POSTGRES_USER: ${WAREHOUSE_PG_USER:-retail}
      POSTGRES_PASSWORD: ${WAREHOUSE_PG_PASSWORD:-retail}
      POSTGRES_DB: ${WAREHOUSE_PG_DB:-retail}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WAREHOUSE_PG_PORT:-5434}:5432"
    volumes:
      - warehouse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "retail", "-d", "retail"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # THE BROKER. KRaft, no ZooKeeper: one process, not two.
  #
  # TWO LISTENERS ON PURPOSE. The platform runs ON THE HOST (the platform venv), and
  # Airflow runs INSIDE the compose network. A single `advertised.listeners` would serve one
  # of the two and silently break the other — the client connects to the bootstrap, receives
  # the advertised address and goes to talk to it. Same trap as S3_ENDPOINT: `localhost`
  # from outside, service name from inside.
  kafka:
    image: apache/kafka:3.8.1
    container_name: retail-kafka
    profiles: ["stream"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single broker: every replication factor must be 1, or the internal topics never
      # become ready and the first `subscribe` hangs with no visible error.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: retail-lakehouse-kraft-01
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Creates the topic and exits. Same precedent as the `mc` service: the host has no Kafka
  # tools, and depending on a local install would make `make stream-up` non-reproducible.
  #
  # `auto.create.topics.enable=false` on the broker is what gives this service its meaning: a
  # topic created by accident on the first produce would be born with 1 partition and the
  # ordering guarantee would become global BY ACCIDENT — and an accidental guarantee is the
  # one that breaks when volume grows.
  #
  # FOUR PARTITIONS, not one. With one partition ordering would be global without anyone
  # asking, and the claim "ordering is per key" would never be exercised. Four is the smallest
  # number that makes the claim OBSERVABLE — and the key is `order_id`, not `wh`, so that the
  # orders of a single warehouse spread out and the parallelism is real.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: retail-kafka-init
    profiles: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists --topic retail.orders.events.v1 \
          --partitions 4 --replication-factor 1 \
          --config compression.type=zstd \
          --config retention.ms=604800000 \
          --config min.insync.replicas=1
        echo "topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe \
          --topic retail.orders.events.v1
    restart: "no"

  # SPARK. ITS OWN PROFILE, not `stream`, and the reason is an architecture decision:
  #
  # Spark is OPTIONAL in this project. `make silver`, `make warehouse`, the panel and the five
  # DAGs run without it and keep running without it — what guarantees that is the gate in
  # `silver_gate.py`, which drops from the build whatever depends on a table that does not
  # exist. A separate profile makes that promise a property of compose, not a README
  # paragraph: `make up` does not start Spark, and neither does `make stream-up`.
  #
  # It NEEDS both stream-plane services, which is why `make spark-*` requires that
  # `make stream-up` has run: the Iceberg catalog lives in `oltp-postgres`, and the table
  # data lives in MinIO.
  #
  # A ONE-SHOT SERVICE (`docker compose run --rm`), no `sleep infinity`: a Spark container
  # idling in `docker ps` suggests a cluster that does not exist. Here Spark runs
  # `local[*]` — one process, driver and executor in the same JVM. What is demonstrated is
  # interoperability and the shape of the job, not a cluster.
  spark:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    image: retail-lakehouse/spark:3.5.3
    profiles: ["spark"]
    # NO `depends_on`, and that is a consequence of the profiles being independent:
    # `oltp-postgres` lives in the `stream` profile, so with `--profile spark` alone it does not
    # even exist in the project, and compose refuses the reference. The Makefile enforces the
    # prerequisite, with a message that says what to do — like the DuckDB lock check in `make
    # silver`. Replacing that with `profiles: [spark, stream]` would make `--profile spark`
    # start a Kafka broker that Spark does not use.
    environment:
      # INSIDE the compose network addresses are SERVICE names. Same trap
      # already documented in the two Kafka listeners: `localhost:9000` serves the platform
      # venv, which runs on the host, and does not resolve here.
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # The catalog is the SAME one pyiceberg writes — the URI changes dialect (JDBC instead
      # of SQLAlchemy) because the client is Java, but it points to the same database and the
      # same two tables. If it pointed elsewhere, there would be no interop to demonstrate.
      ICEBERG_CATALOG_JDBC: jdbc:postgresql://oltp-postgres:5432/${ICEBERG_CATALOG_DB:-iceberg_catalog}
      ICEBERG_CATALOG_USER: oltp
      ICEBERG_CATALOG_PASSWORD: oltp
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-retail}
      ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE:-projection}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://retail-lakehouse/iceberg}
      # PYTHONPATH does NOT come from here, on purpose: see Dockerfile.spark. Setting it here
      # wipes pyspark's own path, because the image leaves it empty.
    volumes:
      # READ-ONLY, unlike the Airflow mount: Spark writes to Iceberg, in MinIO.
      # If it ever needs to write to the checkout, that is a defect to investigate and
      # not a permission to loosen.
      - ../:/repo:ro
    working_dir: /repo
    restart: "no"

  # Migrates the schema, creates the UI user and — what matters for the architecture — creates
  # the 1-slot POOL. Without it the LocalExecutor would run several `extract`s in parallel and
  # double the request rate against the source, because the Source throttle is per
  # process. Runs once and exits.
  airflow-init:
    <<: *airflow-common
    container_name: retail-airflow-init
    # ROOT on purpose, and the only service that runs that way: the airflow-logs volume is born
    # owned by root, and scheduler/webserver run as AIRFLOW_UID. Without the chown below, the
    # scheduler dies with PermissionError when writing the parse log — and the symptom is
    # misleading, because `airflow dags list` (which reads files) works while the DAG never
    # reaches the database.
    user: "0:0"
    # `command`, NOT `entrypoint`: overriding the entrypoint would skip the image's
    # /entrypoint, which is what creates the /etc/passwd entry for the host AIRFLOW_UID.
    # Without it Airflow dies in getpass.getuser() with "no username".
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/logs
        chmod -R g+rwX /opt/airflow/logs
        airflow db migrate
        airflow users create --role Admin --username admin --password admin \
          --firstname admin --lastname admin --email admin@example.com || true
        airflow pools set mercadona_api 1 \
          "Serializes requests against the API: the Source throttle is per process"
        echo "airflow-init done"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: retail-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: retail-airflow-webserver
    command: webserver
    # Same reason as MinIO: the UI starts with admin/admin.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  oltp-data:
  warehouse-postgres-data:
  kafka-data:
  airflow-logs:
