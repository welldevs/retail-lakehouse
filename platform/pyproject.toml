[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-platform"
version = "0.1.0"
description = "Camada de plataforma: RAW no object storage e Silver sobre os snapshots da Source"
requires-python = ">=3.12"

# A FRONTEIRA: estas dependencias sao da PLATAFORMA. A Source, em
# sources/mercadona-catalog-source, mantem dependencies = [] e um venv proprio.
# Os dois conjuntos nunca se encontram, e nada aqui importa mercadona_catalog_source.
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.scripts]
retail-platform = "retail_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
