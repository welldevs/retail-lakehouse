[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-platform"
version = "0.1.0"
description = "Platform layer: RAW in object storage and Silver over the Sources' snapshots"
requires-python = ">=3.12"

# THE BOUNDARY: these dependencies belong to the PLATFORM. The Source, in
# sources/mercadona-catalog-source, keeps dependencies = [] and its own venv.
# The two sets never meet, and nothing here imports mercadona_catalog_source.
dependencies = [
    "boto3>=1.34",
    # UPPER BOUND, measured: the Airflow image rebuilt on 2026-10-29 pulled duckdb 2.0.0
    # while the host venv had 1.5.5, and the same Silver build that passes on 1.5.5 died
    # of "Out of Memory" in the container on 2.0.0 (CR-016). An unbounded floor is how a
    # rebuild silently changes the engine. Lift it deliberately, with a measured build.
    "duckdb>=1.1,<2",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # Second dbt target. The Silver SQL keeps running on duckdb; the models/warehouse/
    # tree runs here. The two never cross in one run — different adapters do not share
    # `ref()` — and the per-target `+enabled` guard in dbt_project.yml is what prevents
    # running the wrong tree on the wrong engine.
    "dbt-snowflake>=1.8",
    # Transport for the cut (PUT to an internal stage + COPY INTO). The credential always
    # comes from ~/.snowflake/config.toml by connection name; no secrets in the repo.
    "snowflake-connector-python>=3.12",
    # THIRD dbt target: local Postgres, a second warehouse target next to Snowflake —
    # the fallback for when the trial expires (see DECISIONS.md). The same `target.type`
    # guard in dbt_project.yml decides which tree runs on which engine.
    "dbt-postgres>=1.8",
    # The orders OLTP and its outbox. It lives IN THE PLATFORM, never in the Source: a
    # Source with a database dependency would stop being FROZEN, and `make source-test`
    # fails that by AST. Also reused by `postgres_load.py`: no new driver for the local
    # warehouse.
    "psycopg[binary]>=3.2",
    # Event transport. Also platform-only: the Source produces the log and does not know a
    # broker exists — `make source-test` fails by AST if it ever does.
    "confluent-kafka>=2.5",
    # Live projection in Iceberg, with a SQL catalog in the OLTP's own Postgres.
    #
    # WITHOUT THE `s3fs` EXTRA, ON PURPOSE: it drags in an `aiobotocore` that pins an old
    # botocore and conflicts with the boto3 the platform already uses for RAW — measured,
    # pip accepts the install and `boto3` breaks afterwards. `PyArrowFileIO` does the same
    # job with the pyarrow that pyiceberg already ships, and it is what the catalog
    # declares in `py-io-impl`.
    "pyiceberg[sql-postgres,pyarrow]>=0.9",
]

# OUTSIDE `dependencies`, for a concrete reason: infra/Dockerfile.airflow installs exactly
# `['project']['dependencies']` from this list. Streamlit, pandas and altair weigh ~150 MB
# and serve no DAG — keeping them in the main list would push them into the Airflow image,
# which renders no dashboard at all.
#
# Same venv, though: the app needs the `snowflake-connector-python` already listed above,
# and a second venv would duplicate the connector just to avoid duplicating streamlit.
# Install with `make dashboard-venv`.
[project.optional-dependencies]
dashboard = [
    "streamlit>=1.39",
    # The connector returns results as pandas via `fetch_pandas_all()`, which is the path
    # that avoids building 112 thousand Python tuples only to convert them afterwards.
    "pandas>=2.2",
    "pyarrow>=15",
    "altair>=5.4",
]

[project.scripts]
retail-platform = "retail_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
