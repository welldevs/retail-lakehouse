name: retail_lakehouse
version: "0.1.0"
config-version: 2
profile: retail_lakehouse

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Prefixo do RAW aterrissado. Sobrescrevivel para apontar para outro bucket.
  raw_prefix: "s3://retail-raw/mercadona_catalog_api"
  # Segunda source, mesmo bucket RAW, prefixo proprio — land.py deriva o prefixo do
  # source_name do manifesto, entao nao foi preciso nenhum bucket novo para isto.
  ine_raw_prefix: "s3://retail-raw/ine_population_api"
  # Terceira source: Callejero do INE (sem API, intake de arquivos baixados manualmente).
  callejero_raw_prefix: "s3://retail-raw/ine_callejero"
  # Quarta source, a primeira DERIVADA: consome o Silver que as outras tres produziram e
  # devolve uma RAW nova. Mesmo bucket, prefixo proprio — land.py deriva o prefixo do
  # source_name do manifesto, entao nada estrutural mudou para acomoda-la.
  oltp_raw_prefix: "s3://retail-raw/simulated_oltp"
  # Quinta source, a segunda DERIVADA, e a primeira que entrega um LOG e nao uma fotografia.
  # Mesmo bucket, prefixo proprio, mesma razao das anteriores.
  orders_raw_prefix: "s3://retail-raw/simulated_orders"
  # Onde esta o metadado CORRENTE da tabela Iceberg da projecao viva. Vazio por padrao: o
  # modelo `silver_live_order_state` so entra no build quando `make silver` consegue resolver
  # o caminho no catalogo, e ai passa o valor por --vars. Cravar um caminho aqui envelheceria
  # a cada commit da tabela; adivinhar varrendo o storage e o que o DuckDB chama de inseguro.
  live_order_state_metadata: ""
  # A fonte NAO declara moeda (CONTRACT.md 4.6). O Silver nao inventa: esta var existe
  # para o Gold, e e PREMISSA do consumidor, nao dado da fonte.
  currency: "EUR"

models:
  retail_lakehouse:
    silver:
      # Saida em parquet no object storage. Cada modelo declara seu proprio `location`
      # e particionamento: o grao difere entre eles.
      +materialized: external
      +format: parquet
      # GUARD POR MOTOR. Sem ele, `dbt build --target snowflake` tentaria rodar um
      # read_json sobre s3:// dentro do Snowflake e falharia com um erro de sintaxe que
      # nao diz o que aconteceu. Com ele, cada arvore so existe no motor que a entende, e
      # `dbt build` sem --select faz a coisa certa nos dois targets.
      +enabled: "{{ target.type == 'duckdb' }}"

    warehouse:
      # O modelo dimensional. Vive so no Snowflake — nao ha espelho em DuckDB, porque
      # espelhar significaria duas materializacoes da mesma verdade. A portabilidade que
      # importa e a do SQL do dbt, nao uma segunda copia (ARCHITECTURE.md:44).
      +enabled: "{{ target.type == 'snowflake' }}"
      +materialized: table
      gold:
        +schema: GOLD
      mart:
        +schema: MART

# MESMO GUARD, PARA OS TESTES SINGULARES. Sem isto o build quebra nos DOIS sentidos, e o
# erro nao diz por que: os testes de tests/*.sql fazem ref() de modelos Silver (desligados
# no Snowflake) e os de tests/warehouse/*.sql fazem ref() de modelos do Gold (desligados no
# DuckDB). O dbt compila TODO teste singular do projeto, independente do target — um ref()
# para modelo desabilitado e erro de compilacao, nao um skip.
data_tests:
  retail_lakehouse:
    +enabled: "{{ target.type == 'duckdb' }}"
    warehouse:
      +enabled: "{{ target.type == 'snowflake' }}"

seeds:
  retail_lakehouse:
    # SO NO DUCKDB. Os catorze seeds alimentam modelos do Silver: warehouse_service_area
    # e warehouse_province_map, os dois de-para do INE (codigo de municipio e serie
    # homonima), as premissas de Orders, as de Customer, e os oito da calibracao de
    # demanda — tudo do lado do lakehouse. A arvore do warehouse le exclusivamente
    # `source()` sobre o STAGE e nao referencia seed nenhum. Sem este guard,
    # `dbt build --target snowflake` carregava os catorze para dentro do Snowflake, onde
    # ficavam sem funcao e sem quem os mantivesse em dia.
    +enabled: "{{ target.type == 'duckdb' }}"

    frozen_capture_seed:
      # POR QUE ESTE PRECISA DECLARAR TIPO, e o motivo e diferente dos outros. Ele nasce
      # VAZIO — so cabecalho — porque "ainda nao selado" e um estado legitimo, o de qualquer
      # clone novo. Sem linha para inferir, o dbt-duckdb tipa toda coluna como INTEGER, e o
      # teste que le o seed quebra com "replace(INTEGER, ...)" — um erro sobre o tipo, tres
      # passos longe da causa, que e a AUSENCIA de dado.
      #
      # Um seed vazio nao pode mudar o schema. Declarar os tipos faz o estado nao-selado se
      # comportar exatamente como o selado, so que sem linhas.
      #
      # E `+full_refresh` PORQUE A SEQUENCIA NORMAL QUEBRAVA SEM ELE. Quem roda `make silver`
      # antes de `make freeze` — que e a ordem natural — criava a tabela a partir do CSV
      # VAZIO; o dbt entao reutiliza o schema existente, e a carga seguinte, ja com o selo,
      # morria em "Could not convert string 'ine_callejero' to INTEGER". O erro fala de tipo
      # e a causa e o estado anterior da tabela, o que e o pior tipo de mensagem.
      #
      # Semanticamente e o certo, e nao um contorno: o selo e SUBSTITUIDO inteiro por
      # `make freeze`, nunca acrescentado. Uma tabela que so pode ser trocada por completo
      # nao tem por que ser carregada incrementalmente.
      +full_refresh: true
      +column_types:
        source: varchar
        partition_key: varchar
        files: integer
        records: bigint
        bytes: bigint
        content_sha256: varchar
    warehouse_province_map_seed:
      # Sem isto, a inferencia de tipo do dbt-duckdb le "08"/"079" como inteiro e come o
      # zero a esquerda (08 -> 8) — os codigos do INE nao sao numeros, sao identificadores.
      +column_types:
        wh: varchar
        province_code: varchar
        province_name: varchar
        municipio_code: varchar
        municipio_name: varchar
    warehouse_service_area_seed:
      +column_types:
        wh: varchar
        province_code: varchar
        municipality_code: varchar
        municipality_name: varchar
        is_home_municipality: boolean
    ine_municipality_codes_seed:
      +column_types:
        province_code: varchar
        municipality_code: varchar
        municipality_name: varchar
    ine_ambiguous_series_seed:
      +column_types:
        series_code: varchar
        municipality_name: varchar
        sex_label: varchar
        province_code: varchar
        municipality_code: varchar

    order_premises_seed:
      # `value` DECIMAL e nao DOUBLE, apesar de nenhuma destas linhas ser dinheiro. O
      # motivo e outro: a coluna mistura proporcoes (0.008) com contagens de minutos (90),
      # e um DOUBLE faria `date_diff(...) > value` depender de arredondamento binario num
      # limiar que existe justamente para ser comparado. DECIMAL compara exato e vira
      # NUMBER(18,6) do outro lado da fronteira sem passar por FLOAT.
      +column_types:
        premise_key: varchar
        value: decimal(18,6)
        unit: varchar
        label: varchar
        rationale: varchar

    customer_premises_seed:
      # `value` VARCHAR e nao DECIMAL, ao contrario de order_premises_seed: esta coluna
      # mistura um inteiro (18) com tres nomes de regra ("adult_resident_population",
      # "per_warehouse_population") e um ponteiro para outro seed. Tipar como numero exigiria
      # dois arquivos, e separar a idade minima das regras que a acompanham seria pior — o
      # mesmo criterio que ja mantem demand_profile_seed.value como varchar.
      +column_types:
        premise_key: varchar
        value: varchar
        unit: varchar
        label: varchar
        rationale: varchar

    mapa_2025_benchmark_seed:
      # `informe_section` PRECISA ser varchar: "4.3" e "3" viram DOUBLE na inferencia e a
      # citacao da secao — que e a rastreabilidade inteira desta tabela — vira 4.3 e 3.0.
      # Os shares sao DECIMAL pelo mesmo motivo de order_premises_seed: sao comparados
      # contra medicoes num teste de tolerancia, e comparacao binaria de limiar nao serve.
      +column_types:
        mapa_key: varchar
        mapa_label: varchar
        scope: varchar
        use_as_weight: boolean
        volume_share_pct: decimal(9,4)
        value_share_pct: decimal(9,4)
        avg_price_eur_kg: decimal(9,4)
        volume_yoy_pct: decimal(9,4)
        value_yoy_pct: decimal(9,4)
        ecommerce_volume_pct: decimal(9,4)
        channel_basis: varchar
        informe_section: varchar
        provenance: varchar
        note: varchar
    demand_category_mapping_seed:
      +column_types:
        l1: varchar
        l2: varchar
        l3: varchar
        mapa_key: varchar
        rationale: varchar
    demand_profile_seed:
      # `value` e varchar de proposito: a coluna mistura versao ("mapa_2025_v1"), nome de
      # regra ("assortment") e numero (0.85). Tipar como numero forcaria dois seeds, e
      # separar a versao do modelo dos parametros que ela versiona seria pior.
      +column_types:
        param_key: varchar
        value: varchar
        unit: varchar
        label: varchar
        rationale: varchar
    demand_seasonality_seed:
      +column_types:
        month: integer
        factor: decimal(9,4)
        label: varchar
        rationale: varchar

    demand_cohort_age_seed:
      # `informe_page` e varchar porque uma linha cita TRES paginas ("57;61;65"): o perfil
      # de ACEITES_OLIVA e composto das tres secoes de azeite de oliva. Tipar como inteiro
      # perderia justamente a linha cuja rastreabilidade e menos obvia.
      +column_types:
        mapa_key: varchar
        age_band: varchar
        population_share_pct: decimal(9,4)
        volume_share_pct: decimal(9,4)
        informe_page: varchar
        provenance: varchar
        note: varchar
    demand_cohort_region_seed:
      # `ccaa_code` varchar pelo mesmo motivo de province_code: 01 e 09 sao identificadores
      # do INE, e a inferencia numerica comeria o zero a esquerda.
      +column_types:
        mapa_key: varchar
        ccaa_code: varchar
        ccaa_label: varchar
        population_share_pct: decimal(9,4)
        volume_share_pct: decimal(9,4)
        informe_page: varchar
        provenance: varchar
        note: varchar
    mapa_2025_region_seed:
      +column_types:
        ccaa_code: varchar
        ccaa_label: varchar
        per_capita_kg_l: decimal(9,2)
        per_capita_eur: decimal(9,2)
        informe_section: varchar
        provenance: varchar
        note: varchar
    ine_ccaa_map_seed:
      +column_types:
        province_code: varchar
        province_name: varchar
        ccaa_code: varchar
        ccaa_label: varchar
