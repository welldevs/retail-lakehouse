name: retail_lakehouse
version: "0.1.0"
config-version: 2
profile: retail_lakehouse

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# POSTGRES TARGET ONLY. `try_parse_json` is native to Snowflake; here the same call,
# deliberately IDENTICAL in fact_order_event.sql on both engines, needs an equivalent
# function that dbt itself creates before any model runs — not a manual step to remember
# after `make warehouse-postgres-bootstrap`. See macros/warehouse_compat.sql.
on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_try_parse_json_function() }}{% endif %}"

vars:
  # Prefix of the landed RAW. Overridable to point at another bucket.
  raw_prefix: "s3://retail-raw/mercadona_catalog_api"
  # Second source, same RAW bucket, its own prefix — land.py derives the prefix from the
  # manifest's source_name, so no new bucket was needed for this.
  ine_raw_prefix: "s3://retail-raw/ine_population_api"
  # Third source: INE Callejero (no API, intake of manually downloaded files).
  callejero_raw_prefix: "s3://retail-raw/ine_callejero"
  # Fourth source, the first DERIVED one: consumes the Silver the other three produced and
  # returns a new RAW. Same bucket, its own prefix — land.py derives the prefix from the
  # manifest's source_name, so nothing structural changed to accommodate it.
  oltp_raw_prefix: "s3://retail-raw/simulated_oltp"
  # Fifth source, the second DERIVED one, and the first that delivers a LOG rather than a
  # snapshot. Same bucket, its own prefix, same reason as the previous ones.
  orders_raw_prefix: "s3://retail-raw/simulated_orders"
  # Where the CURRENT metadata of the live projection's Iceberg table is. Empty by default:
  # the `silver_live_order_state` model only joins the build when `make silver` can resolve
  # the path in the catalog, and then passes the value via --vars. Hard-coding a path here
  # would go stale on every table commit; guessing by scanning storage is what DuckDB calls
  # unsafe.
  live_order_state_metadata: ""
  # The source does NOT declare a currency (CONTRACT.md 4.6). Silver does not invent one:
  # this var exists for Gold, and it is a consumer PREMISE, not source data.
  currency: "EUR"

models:
  retail_lakehouse:
    silver:
      # Output as parquet in object storage. Each model declares its own `location`
      # and partitioning: the grain differs between them.
      +materialized: external
      +format: parquet
      # PER-ENGINE GUARD. Without it, `dbt build --target snowflake` would try to run a
      # read_json over s3:// inside Snowflake and fail with a syntax error that does not
      # say what happened. With it, each tree only exists on the engine that understands
      # it, and `dbt build` without --select does the right thing on both targets.
      +enabled: "{{ target.type == 'duckdb' }}"

    warehouse:
      # The dimensional model. Lives in Snowflake OR in local Postgres — there is no DuckDB
      # mirror, because mirroring would mean two materializations of the same truth. The
      # portability that matters is that of the dbt SQL, not a second copy
      # (ARCHITECTURE.md:44). Postgres came in as a SECOND engine accepted here — not a new
      # third guard — because it plays the same role Snowflake already had: a relational
      # destination that reads STAGE through `source()` and writes GOLD/MART. See DECISIONS.md.
      +enabled: "{{ target.type in ('snowflake', 'postgres') }}"
      +materialized: table
      gold:
        +schema: GOLD
      mart:
        +schema: MART

# SAME GUARD, FOR THE SINGULAR TESTS. Without this the build breaks in BOTH directions, and
# the error does not say why: the tests in tests/*.sql ref() Silver models (disabled on
# Snowflake) and those in tests/warehouse/*.sql ref() Gold models (disabled on DuckDB).
# dbt compiles EVERY singular test in the project, regardless of target — a ref() to a
# disabled model is a compilation error, not a skip.
data_tests:
  retail_lakehouse:
    +enabled: "{{ target.type == 'duckdb' }}"
    warehouse:
      +enabled: "{{ target.type in ('snowflake', 'postgres') }}"

seeds:
  retail_lakehouse:
    # DUCKDB ONLY. The sixteen seeds feed Silver models: warehouse_service_area and
    # warehouse_province_map, the two INE mappings (municipality code and homonymous
    # series), the Orders premises, the Customer ones, the Stock ones, the frozen-capture
    # seal, and the eight demand-calibration ones — all on the lakehouse side. The
    # warehouse tree reads exclusively `source()` over STAGE and references no seed.
    # Without this guard, `dbt build --target snowflake` loaded all sixteen into
    # Snowflake, where they sat with no purpose and nobody to keep them up to date.
    +enabled: "{{ target.type == 'duckdb' }}"

    frozen_capture_seed:
      # WHY THIS ONE MUST DECLARE TYPES, and the reason differs from the others. It starts
      # EMPTY — header only — because "not sealed yet" is a legitimate state, that of any
      # fresh clone. With no row to infer from, dbt-duckdb types every column as INTEGER,
      # and the test that reads the seed breaks with "replace(INTEGER, ...)" — an error
      # about the type, three steps away from the cause, which is the ABSENCE of data.
      #
      # An empty seed must not change the schema. Declaring the types makes the unsealed
      # state behave exactly like the sealed one, just without rows.
      #
      # And `+full_refresh` BECAUSE THE NORMAL SEQUENCE BROKE WITHOUT IT. Whoever ran
      # `make silver` before `make freeze` — the natural order — created the table from the
      # EMPTY CSV; dbt then reuses the existing schema, and the next load, now with the
      # seal, died with "Could not convert string 'ine_callejero' to INTEGER". The error
      # talks about type and the cause is the previous state of the table, which is the
      # worst kind of message.
      #
      # Semantically it is the right thing, not a workaround: the seal is REPLACED whole by
      # `make freeze`, never appended to. A table that can only be swapped out completely
      # has no reason to be loaded incrementally.
      +full_refresh: true
      +column_types:
        source: varchar
        partition_key: varchar
        files: integer
        records: bigint
        bytes: bigint
        content_sha256: varchar
    warehouse_province_map_seed:
      # Without this, dbt-duckdb type inference reads "08"/"079" as integers and eats the
      # leading zero (08 -> 8) — INE codes are not numbers, they are identifiers.
      +column_types:
        wh: varchar
        province_code: varchar
        province_name: varchar
        municipio_code: varchar
        municipio_name: varchar
    warehouse_service_area_seed:
      +column_types:
        wh: varchar
        province_code: varchar
        municipality_code: varchar
        municipality_name: varchar
        is_home_municipality: boolean
    ine_municipality_codes_seed:
      +column_types:
        province_code: varchar
        municipality_code: varchar
        municipality_name: varchar
    ine_ambiguous_series_seed:
      +column_types:
        series_code: varchar
        municipality_name: varchar
        sex_label: varchar
        province_code: varchar
        municipality_code: varchar

    order_premises_seed:
      # `value` DECIMAL and not DOUBLE, even though none of these rows is money. The reason
      # is different: the column mixes proportions (0.008) with minute counts (90), and a
      # DOUBLE would make `date_diff(...) > value` depend on binary rounding at a threshold
      # that exists precisely to be compared. DECIMAL compares exactly and becomes
      # NUMBER(18,6) on the other side of the boundary without going through FLOAT.
      +column_types:
        premise_key: varchar
        value: decimal(18,6)
        unit: varchar
        label: varchar
        rationale: varchar

    customer_premises_seed:
      # `value` VARCHAR and not DECIMAL, unlike order_premises_seed: this column mixes an
      # integer (18) with three rule names ("adult_resident_population",
      # "per_warehouse_population") and a pointer to another seed. Typing it as a number
      # would require two files, and separating the minimum age from the rules that come
      # with it would be worse — the same criterion that keeps demand_profile_seed.value
      # as varchar.
      +column_types:
        premise_key: varchar
        value: varchar
        unit: varchar
        label: varchar
        rationale: varchar

    mapa_2025_benchmark_seed:
      # `informe_section` MUST be varchar: "4.3" and "3" become DOUBLE under inference and
      # the section citation — which is this table's entire traceability — becomes 4.3 and
      # 3.0. The shares are DECIMAL for the same reason as order_premises_seed: they are
      # compared against measurements in a tolerance test, and binary threshold comparison
      # does not work.
      +column_types:
        mapa_key: varchar
        mapa_label: varchar
        scope: varchar
        use_as_weight: boolean
        volume_share_pct: decimal(9,4)
        value_share_pct: decimal(9,4)
        avg_price_eur_kg: decimal(9,4)
        volume_yoy_pct: decimal(9,4)
        value_yoy_pct: decimal(9,4)
        ecommerce_volume_pct: decimal(9,4)
        channel_basis: varchar
        informe_section: varchar
        provenance: varchar
        note: varchar
    demand_category_mapping_seed:
      +column_types:
        l1: varchar
        l2: varchar
        l3: varchar
        mapa_key: varchar
        rationale: varchar
    demand_profile_seed:
      # `value` is varchar on purpose: the column mixes a version ("mapa_2025_v1"), a rule
      # name ("assortment") and a number (0.85). Typing it as a number would force two
      # seeds, and separating the model version from the parameters it versions would be
      # worse.
      +column_types:
        param_key: varchar
        value: varchar
        unit: varchar
        label: varchar
        rationale: varchar
    demand_seasonality_seed:
      +column_types:
        month: integer
        factor: decimal(9,4)
        label: varchar
        rationale: varchar

    demand_cohort_age_seed:
      # `informe_page` is varchar because one row cites THREE pages ("57;61;65"): the
      # ACEITES_OLIVA profile is composed of the three olive-oil sections. Typing it as an
      # integer would lose precisely the row whose traceability is least obvious.
      +column_types:
        mapa_key: varchar
        age_band: varchar
        population_share_pct: decimal(9,4)
        volume_share_pct: decimal(9,4)
        informe_page: varchar
        provenance: varchar
        note: varchar
    demand_cohort_region_seed:
      # `ccaa_code` varchar for the same reason as province_code: 01 and 09 are INE
      # identifiers, and numeric inference would eat the leading zero.
      +column_types:
        mapa_key: varchar
        ccaa_code: varchar
        ccaa_label: varchar
        population_share_pct: decimal(9,4)
        volume_share_pct: decimal(9,4)
        informe_page: varchar
        provenance: varchar
        note: varchar
    mapa_2025_region_seed:
      +column_types:
        ccaa_code: varchar
        ccaa_label: varchar
        per_capita_kg_l: decimal(9,2)
        per_capita_eur: decimal(9,2)
        informe_section: varchar
        provenance: varchar
        note: varchar
    ine_ccaa_map_seed:
      +column_types:
        province_code: varchar
        province_name: varchar
        ccaa_code: varchar
        ccaa_label: varchar
