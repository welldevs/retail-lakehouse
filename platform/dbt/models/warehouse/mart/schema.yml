version: 2

models:
  - name: mart_price_evolution
    description: >
      GRAO (snapshot_date, wh, source_product_id) — por dia OBSERVADO, nunca por dia de
      calendario. Como o preco de cada produto se moveu em cada armazem.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: source_product_id
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: days_since_previous_snapshot
        description: >
          Nulo na primeira observacao de cada produto. Onde nao e nulo, e a distancia real
          ate a observacao anterior — comparar variacoes sem olhar esta coluna mistura uma
          mudanca de 8 dias com uma de 1.
      - name: identity_review_needed
        description: "Id novo com nome que ja existia. A decisao e de quem consulta."
        tests: [not_null]

  - name: mart_assortment_daily
    description: >
      GRAO (snapshot_date, wh, category_id) — quanto de catalogo cada armazem tem por
      categoria, a que preco, e quanto disso e exclusivo dele.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: products
        tests: [not_null]
      - name: products_in_all_warehouses
        description: >
          Denominador honesto de qualquer comparacao entre armazens: comparar preco medio
          de catalogos diferentes mede diferenca de catalogo, nao de preco. Calculado por
          DIA, porque o catalogo muda.
        tests: [not_null]

  - name: mart_customer_base
    description: >
      GRAO (customer_id) — a base VIGENTE. A PESSOA e sintetica, o ENDERECO e real, e a
      populacao do municipio da o contexto sem o qual "3 clientes em Ajalvir" nao diz nada.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: wh
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: postal_code
        tests: [not_null]
      - name: age_band
        tests: [not_null]

  - name: mart_market_coverage
    description: >
      GRAO (wh, province_code, municipality_code) — TODOS os 370 municipios da AUF,
      inclusive os que ainda nao receberam nenhum cliente. E o LEFT JOIN que faz este mart
      valer: partir dos clientes mostraria 100% de cobertura por construcao, sempre.
    columns:
      - name: wh
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: municipality_population
        description: "Do INE, observado. Denominador de customers_per_10k_inhabitants."
      - name: customers
        description: "Sintetico. Zero e um valor legitimo e informativo aqui."
        tests: [not_null]
      - name: customers_per_10k_inhabitants
        description: >
          Numerador sintetico sobre denominador observado. Serve para comparar a DENSIDADE
          DA SIMULACAO entre municipios — nunca como estimativa de penetracao de mercado.
      - name: has_no_customers
        tests: [not_null]

  - name: mart_order_funnel
    description: >
      GRAO (order_date, wh) — uma linha por armazem por dia. O funil se apoia em MARCO
      ALCANCADO, nunca em order_status, e a diferenca foi medida em 2026-06: contar
      order_status = 'DELIVERED' dava 5.985 entregas, contar delivered_at is not null dava
      6.046. Eram os 61 pedidos devolvidos daquela captura,
      que tambem foram entregues. Marco e monotonico; status nao e. As colunas de SAIDA
      (cancelados, devolvidos) nao somam com as etapas — elas vivem num bloco proprio.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: orders_placed
        tests: [not_null]
      - name: orders_delivered
        description: "Por marco, nao por status. Ver assert_order_funnel_totals_match_fact_order."
        tests: [not_null]
      - name: delivery_rate
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_fulfillment_sla
    description: >
      GRAO (order_date, wh) — uma linha por armazem por dia. p50/p90 por etapa, sobre os
      pedidos que ALCANCARAM cada marco (percentile_cont ignora nulo, e nulo aqui significa
      "a etapa nao aconteceu"). ACHADO CORRIGIDO NA FASE 7: sla_minutes_picking valia 90 e
      era inalcancavel por construcao — basket_lines_max (40) x minutes_per_line_picked (2)
      da teto de 80. Zero violacoes, e nao porque a operacao fosse boa. Agora o limiar e
      DERIVADO de sla_picking_percentile sobre a triangular declarada da cesta. sla_minutes,
      max_picking_minutes e orders_breaching_sla continuam viajando lado a lado, porque uma
      contagem de violacoes sem o limiar ao lado nao e conferivel.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: sla_minutes
        description: >
          Vem de FACT_ORDER_PREMISE, nao de uma constante deste modelo. Se a premissa
          sumir do seed, esta coluna vira nula e ESTE not_null reprova — que e a unica
          razao de a CTE usar max(case when...) em vez de um where que esvaziaria o mart.
        tests: [not_null]
      - name: orders_breaching_sla
        tests: [not_null]
      - name: max_picking_minutes
        description: "Medido 80 na janela. Lido junto de sla_minutes, explica o zero."
      - name: orders_placed
        tests: [not_null]
      - name: slot_adherence_rate
        description: >
          Fracao das entregas dentro da janela prometida. NAO leia esta taxa sozinha:
          chegar cedo e chegar tarde sao problemas opostos e ela colapsa os dois. Medido em
          2026-09-01, antes da correcao da Fase 7: 84% das entregas chegavam ANTES de a
          janela abrir, porque slot_lead_hours sorteava 2-24h contra um ciclo de no maximo
          8,5h. Era defeito de modelo, nao de operacao. Com as premissas conciliadas a taxa
          passou a VARIAR; o numero que sair e reportado, nunca alvo.
        tests: [not_null]
      - name: orders_delivered_before_slot
        description: >
          Chegar cedo e chegar tarde sao problemas OPOSTOS. Colapsar os dois em "fora da
          janela" apagaria qual deles esta acontecendo — aqui sao 5.166 contra 409.
        tests: [not_null]
      - name: orders_delivered_after_slot
        tests: [not_null]

  - name: mart_basket_daily
    description: >
      GRAO (order_date, wh, category_id). Lado da DEMANDA, no mesmo eixo que
      MART_ASSORTMENT_DAILY tem o lado da oferta — os dois podem ser postos lado a lado
      sem reagregacao. ATENCAO: orders_touching_category NAO e aditivo entre categorias
      (um pedido com leite e pao conta uma vez em cada); linhas, unidades e valor sao.
      Quem quiser pedidos por dia usa MART_ORDER_FUNNEL, que tem o grao certo.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: orders_touching_category
        description: "NAO SOMA entre categorias. O nome diz isso de proposito."
        tests: [not_null]
      - name: lines_placed
        tests: [not_null]
      - name: revenue_fulfilled
        description: "O que foi ENTREGUE. revenue_placed guarda o que foi pedido, ao lado."
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_demand_cohort
    description: >
      GRAO (order_date, wh, buyer_age_band, demand_group). O que cada coorte de comprador
      leva de cada grupo de demanda. O AGREGADO NAO MUDA em relacao a MART_BASKET_DAILY —
      esse e o criterio de aceitacao do IPF que calibra o perfil por coorte — entao o valor
      deste mart esta inteiramente na CONDICIONAL: comparar `share_within_band` da mesma
      linha entre duas faixas etarias. ATENCAO: orders_in_cohort NAO e aditivo entre faixas
      nem entre grupos, pelo mesmo motivo de orders_touching_category; linhas, unidades e
      valor sao. A faixa vem carimbada no evento order_placed, e nao de dim_customer: e a
      faixa que valia no momento do pedido, e foi ela que escolheu o vetor de pesos.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: buyer_age_band
        description: "LT35 | 35_49 | 50_64 | GE65 — as quatro faixas do informe do MAPA."
        tests:
          - not_null
          - accepted_values:
              values: ['LT35', '35_49', '50_64', 'GE65']
      - name: demand_group
        tests: [not_null]
      - name: orders_in_cohort
        description: "NAO SOMA entre faixas nem entre grupos."
        tests: [not_null]
      - name: share_within_band
        description: >
          Fatia do grupo DENTRO da coorte naquele (dia, armazem). Denominador e a propria
          coorte, e nao o total: e assim que a comparacao entre faixas isola a propensao do
          tamanho da coorte.
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_stock_health
    description: >
      GRAO (stock_date, wh, category_id) — categoria de nivel 2, o mesmo eixo de
      MART_ASSORTMENT_DAILY e MART_BASKET_DAILY, para que as tres se comparem sem conversao.
      Por produto seriam ~17 mil linhas por armazem por dia, o que nao e painel.

      TIRA QUATRO ITENS DE "FORA DE ALCANCE" — ruptura, giro, cobertura e reposicao — e o
      gatilho declarado la ("uma fonte de saldo ou movimento de estoque") NAO foi cumprido.
      Continua nao existindo fonte de estoque; o que mudou e que o saldo passou a ser
      CALCULADO. Por isso a coluna `stock_label` viaja com valor 'synthetic' em toda linha:
      ler ruptura daqui como medicao de campo e o mesmo erro de ler densidade de simulacao
      como penetracao de mercado.

      ADITIVIDADE E A ARMADILHA DESTE MART, e maior aqui que nos outros: saldo nao soma entre
      dias, cobertura e razao e nao se media, e ruptura tem duas unidades que nao se
      substituem. Cada coluna diz qual e o caso.

      LIMITE DECLARADO: a ruptura aqui e INDEPENDENTE das linhas `unavailable` do pedido — o
      gerador remove linha a taxa fixa sorteada, sem olhar saldo. Uma nao causa a outra.
    columns:
      - name: stock_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: product_days
        description: >
          Quantos pares (produto, dia) a linha agrega. E o denominador de qualquer leitura por
          produto — sem ele, series_with_shortfall nao tem escala.
        tests: [not_null]
      - name: units_short
        description: "Aditiva. Quanto faltou, em unidades."
        tests: [not_null]
      - name: series_with_shortfall
        description: >
          Em quantos (produto, dia) faltou alguma coisa. NAO substitui units_short: um produto
          popular faltando 500 unidades e 500 produtos faltando 1 sao problemas operacionais
          diferentes com o mesmo units_short.
        tests: [not_null]
      - name: fill_rate
        description: >
          NULO quando nao houve demanda, e nao 1. "Nada foi pedido" nao e "tudo foi atendido",
          e a diferenca some se o zero virar 100%.
      - name: closing_units
        description: >
          SEMI-ADITIVO: nao some entre dias. E a primeira coisa que um BI vai tentar num eixo
          de tempo, e o resultado e o mesmo estoque contado varias vezes.
        tests: [not_null]
      - name: days_of_cover
        description: >
          A RAZAO DAS SOMAS: quantos dias o estoque da categoria cobre a demanda dela.
          Diferente de days_of_cover_typical_product, que e a media das razoes.
      - name: days_of_cover_typical_product
        description: >
          A MEDIA DAS RAZOES: quantos dias o produto TIPICO cobre. Sempre maior que
          days_of_cover, porque produto de giro baixo tem cobertura enorme e domina a media.
          As duas estao publicadas porque respondem perguntas diferentes.
      - name: turnover_daily
        description: >
          Saidas sobre saldo MEDIO do dia, nao sobre o fechamento — com o fechamento o giro
          explode para infinito no dia em que a prateleira zera, que e o dia mais
          interessante. NAO e anualizado: a janela tem poucos dias e anualizar projetaria
          sazonalidade que ninguem observou.
      - name: stock_label
        description: "Sempre 'synthetic'. O rotulo viaja com o numero, como no Silver."
        tests:
          - not_null
          - accepted_values: {arguments: {values: [synthetic]}}
