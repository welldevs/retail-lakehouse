version: 2

models:
  - name: mart_price_evolution
    description: >
      GRAIN (snapshot_date, wh, source_product_id) — per OBSERVED day, never per calendar
      day. How each product's price moved in each warehouse.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: source_product_id
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: purchasable_unit_price
        description: >
          The price to use for price movement or promotions, not `unit_price`. In ~10 product x
          warehouse combinations (loose items without unit_size), unit_price is the source's weight
          selector ceiling, not a consumer price — see DECISIONS.md, "Demand
          calibration against MAPA 2025".
        tests: [not_null]
      - name: days_since_previous_snapshot
        description: >
          Null on each product's first observation. Where it is not null, it is the real distance
          to the previous observation — comparing changes without looking at this column mixes an
          8-day change with a 1-day one.
      - name: identity_review_needed
        description: "A new id with a name that already existed. The decision belongs to whoever queries."
        tests: [not_null]

  - name: mart_assortment_daily
    description: >
      GRAIN (snapshot_date, wh, category_id) — how much catalog each warehouse has per
      category, at what price, and how much of it is exclusive to it. min/max/avg/median_unit_price
      are over purchasable_unit_price, never over the raw unit_price — see
      assert_mart_assortment_daily_price_stats_use_purchasable_price.sql.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: products
        tests: [not_null]
      - name: products_in_all_warehouses
        description: >
          The honest denominator for any comparison across warehouses: comparing the average price
          of different catalogs measures a catalog difference, not a price difference. Computed per
          DAY, because the catalog changes.
        tests: [not_null]

  - name: mart_customer_base
    description: >
      GRAIN (customer_id) — the CURRENT base. The PERSON is synthetic, the ADDRESS is real, and the
      municipality population gives the context without which "3 customers in Ajalvir" says nothing.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: wh
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: postal_code
        tests: [not_null]
      - name: age_band
        tests: [not_null]

  - name: mart_market_coverage
    description: >
      GRAIN (wh, province_code, municipality_code) — ALL 370 AUF municipalities,
      including those that have not received any customer yet. It is the LEFT JOIN that makes this mart
      worthwhile: starting from the customers would show 100% coverage by construction, always.
    columns:
      - name: wh
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: municipality_population
        description: "From INE, observed. Denominator of customers_per_10k_inhabitants."
      - name: customers
        description: "Synthetic. Zero is a legitimate and informative value here."
        tests: [not_null]
      - name: customers_per_10k_inhabitants
        description: >
          A synthetic numerator over an observed denominator. It serves to compare the SIMULATION'S
          DENSITY across municipalities — never as an estimate of market penetration.
      - name: has_no_customers
        tests: [not_null]

  - name: mart_order_funnel
    description: >
      GRAIN (order_date, wh) — one row per warehouse per day. The funnel rests on the MILESTONE
      REACHED, never on order_status, and the difference was measured in 2026-06: counting
      order_status = 'DELIVERED' gave 5,985 deliveries, counting delivered_at is not null gave
      6,046. They were the 61 returned orders of that capture,
      which were also delivered. A milestone is monotonic; status is not. The EXIT columns
      (cancelled, returned) do not add up with the stages — they live in their own block.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: orders_placed
        tests: [not_null]
      - name: orders_delivered
        description: "By milestone, not by status. See assert_order_funnel_totals_match_fact_order."
        tests: [not_null]
      - name: delivery_rate
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_fulfillment_sla
    description: >
      GRAIN (order_date, wh) — one row per warehouse per day. p50/p90 per stage, over the
      orders that REACHED each milestone (percentile_cont ignores nulls, and null here means
      "the stage did not happen"). FINDING FIXED IN PHASE 7: sla_minutes_picking was 90 and
      was unreachable by construction — basket_lines_max (40) x minutes_per_line_picked (2)
      gives a ceiling of 80. Zero breaches, and not because the operation was good. Now the threshold is
      DERIVED from sla_picking_percentile over the basket's declared triangular. sla_minutes,
      max_picking_minutes and orders_breaching_sla still travel side by side, because a
      breach count without the threshold next to it cannot be checked.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: sla_minutes
        description: >
          It comes from FACT_ORDER_PREMISE, not from a constant of this model. If the premise
          disappears from the seed, this column becomes null and THIS not_null fails — which is the only
          reason the CTE uses max(case when...) instead of a where that would empty the mart.
        tests: [not_null]
      - name: orders_breaching_sla
        tests: [not_null]
      - name: max_picking_minutes
        description: "Measured 80 on the window. Read together with sla_minutes, it explains the zero."
      - name: orders_placed
        tests: [not_null]
      - name: slot_adherence_rate
        description: >
          Fraction of deliveries within the promised window. Do NOT read this rate on its own:
          arriving early and arriving late are opposite problems and it collapses both. Measured on
          2026-09-01, before the Phase 7 fix: 84% of deliveries arrived BEFORE the
          window opened, because slot_lead_hours drew 2-24h against a cycle of at most
          8.5h. It was a model defect, not an operational one. With the premises reconciled the rate
          started to VARY; whatever number comes out is reported, never a target.
        tests: [not_null]
      - name: orders_delivered_before_slot
        description: >
          Arriving early and arriving late are OPPOSITE problems. Collapsing both into "outside the
          window" would erase which one is happening — here it is 5,166 against 409.
        tests: [not_null]
      - name: orders_delivered_after_slot
        tests: [not_null]

  - name: mart_basket_daily
    description: >
      GRAIN (order_date, wh, category_id). The DEMAND side, on the same axis on which
      MART_ASSORTMENT_DAILY has the supply side — the two can be put side by side
      without re-aggregation. CAUTION: orders_touching_category is NOT additive across categories
      (an order with milk and bread counts once in each); lines, units and value are.
      Whoever wants orders per day uses MART_ORDER_FUNNEL, which has the right grain.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: orders_touching_category
        description: "Does NOT SUM across categories. The name says so on purpose."
        tests: [not_null]
      - name: lines_placed
        tests: [not_null]
      - name: revenue_fulfilled
        description: "What was DELIVERED. revenue_placed keeps what was ordered, alongside."
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_demand_cohort
    description: >
      GRAIN (order_date, wh, buyer_age_band, demand_group). What each buyer cohort
      takes from each demand group. THE AGGREGATE DOES NOT CHANGE relative to MART_BASKET_DAILY —
      that is the acceptance criterion of the IPF that calibrates the per-cohort profile — so the value
      of this mart lies entirely in the CONDITIONAL: comparing `share_within_band` of the same
      row across two age bands. CAUTION: orders_in_cohort is NOT additive across bands
      nor across groups, for the same reason as orders_touching_category; lines, units and
      value are. The band comes stamped on the order_placed event, not from dim_customer: it is the
      band that held at the time of the order, and it is what chose the weight vector.
    columns:
      - name: order_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: buyer_age_band
        description: "LT35 | 35_49 | 50_64 | GE65 — the four bands of the MAPA report."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LT35', '35_49', '50_64', 'GE65']
      - name: demand_group
        tests: [not_null]
      - name: orders_in_cohort
        description: "Does NOT SUM across bands nor across groups."
        tests: [not_null]
      - name: share_within_band
        description: >
          The group's slice WITHIN the cohort in that (day, warehouse). The denominator is the cohort
          itself, not the total: that is how the comparison across bands isolates propensity from
          cohort size.
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: mart_stock_health
    description: >
      GRAIN (stock_date, wh, category_id) — level-2 category, the same axis as
      MART_ASSORTMENT_DAILY and MART_BASKET_DAILY, so the three compare without conversion.
      Per product it would be ~17 thousand rows per warehouse per day, which is not a panel.

      IT TAKES FOUR ITEMS OFF "OUT OF REACH" — stockout, turnover, cover and replenishment — and the
      trigger declared there ("a source of stock balance or movement") was NOT met.
      There is still no stock source; what changed is that the balance is now
      COMPUTED. That is why the `stock_label` column travels with the value 'synthetic' on every row:
      reading stockout from here as a field measurement is the same mistake as reading simulation density
      as market penetration.

      ADDITIVITY IS THIS MART'S TRAP, and bigger here than in the others: balance does not sum across
      days, cover is a ratio and is not averaged, and stockout has two units that do not
      replace each other. Each column says which case applies.

      DECLARED LIMIT: the stockout here is INDEPENDENT of the order's `unavailable` lines — the
      generator removes lines at a fixed drawn rate, without looking at the balance. Neither causes the other.
    columns:
      - name: stock_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: product_days
        description: >
          How many (product, day) pairs the row aggregates. It is the denominator of any per-product
          reading — without it, series_with_shortfall has no scale.
        tests: [not_null]
      - name: units_short
        description: "Additive. How much was short, in units."
        tests: [not_null]
      - name: series_with_shortfall
        description: >
          In how many (product, day) something was short. It does NOT replace units_short: a popular
          product short by 500 units and 500 products short by 1 are different operational problems
          with the same units_short.
        tests: [not_null]
      - name: fill_rate
        description: >
          NULL when there was no demand, not 1. "Nothing was ordered" is not "everything was served",
          and the difference disappears if zero becomes 100%.
      - name: closing_units
        description: >
          SEMI-ADDITIVE: do not sum across days. It is the first thing a BI will try on a time
          axis, and the result is the same stock counted several times.
        tests: [not_null]
      - name: days_of_cover
        description: >
          THE RATIO OF THE SUMS: how many days the category's stock covers its demand.
          Different from days_of_cover_typical_product, which is the average of the ratios.
      - name: days_of_cover_typical_product
        description: >
          THE AVERAGE OF THE RATIOS: how many days the TYPICAL product covers. Always greater than
          days_of_cover, because low-turnover products have huge cover and dominate the average.
          Both are published because they answer different questions.
      - name: turnover_daily
        description: >
          Outflows over the day's AVERAGE balance, not over the closing — with the closing, turnover
          explodes to infinity on the day the shelf hits zero, which is the most
          interesting day. It is NOT annualized: the window has few days and annualizing would project
          seasonality nobody observed.
      - name: stock_label
        description: "Always 'synthetic'. The label travels with the number, as in Silver."
        tests:
          - not_null
          - accepted_values: {arguments: {values: [synthetic]}}
