version: 2

models:
  - name: dim_date
    description: "COMPLETE calendar 2020-2030. Grain: one day. Synthetic (generated, not observed)."
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]

  - name: dim_warehouse
    description: "The 4 warehouses and their AUF. Grain: one warehouse."
    columns:
      - name: wh
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [mad1, bcn1, svq1, vlc1]
      - name: province_name
        tests: [not_null]
      - name: municipalities_served
        tests: [not_null]
      - name: home_municipalities
        description: >
          Exactly 1 per warehouse. More than one would mean the service-area seed
          lost track of the home municipality.
        tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false

  - name: dim_geography
    description: >
      Grain (province_code, municipality_code, postal_code) — 699 rows. postal_code
      ALONE is not a key: 29 postal codes cross a municipality boundary (measured).
    columns:
      - name: geography_sk
        tests: [not_null, unique]
      - name: postal_code
        description: "NOT unique. See assert_geography_postal_code_is_not_a_key."
        tests: [not_null]
      - name: municipality_name
        description: "INE 29005 spelling. The Callejero's travels alongside, with its own label."
        tests: [not_null]
      - name: municipality_name_callejero
        description: >
          Callejero spelling. It diverges from INE's in 370 of 370 cases ("BRUC (EL)" against
          "Bruc, El"). The two coexist so that the divergence is visible; what is
          compared across sources is always the code.
        tests: [not_null]
      - name: wh
        description: "A function of the (municipality, postal code) pair: measured that 0 postal codes cross warehouses."
        tests: [not_null]

  - name: dim_category
    description: "2-level tree, global. Grain: level-2 category (151)."
    columns:
      - name: category_sk
        tests: [not_null, unique]
      - name: category_id
        tests: [not_null, unique]
      - name: category_name
        tests: [not_null]
      - name: parent_category_id
        description: "Level 1 (26). It exists ONLY in the tree: the API answers 404/410 for those ids."
        tests: [not_null]

  - name: dim_product
    description: >
      SCD2 derived from the complete HISTORY, not accumulated through MERGE — the dimension can be
      rebuilt from scratch at any time and always gives the same result. Grain
      (source_product_id, valid_from).
    columns:
      - name: product_sk
        tests: [not_null, unique]
      - name: source_product_id
        description: >
          SOURCE KEY, not a business identity. The SCD2 models the key's
          lifecycle; see identity_ambiguous.
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: identity_ambiguous
        description: >
          A new id whose display_name already existed in the previous partition. The source does not say whether it is the
          same item re-keyed or an item withdrawn and another launched — the dimension flags the
          case instead of deciding it.
        tests: [not_null]
      - name: display_name
        tests: [not_null]

  - name: dim_customer
    description: >
      SCD2 of the customer base. Each regeneration is a new version. The PERSON is synthetic; the
      ADDRESS is real, from the Callejero. Grain (customer_id, valid_from).
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: geography_sk
        description: "Joins DIM_GEOGRAPHY by a hash of the natural keys, never by name."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_sk
      - name: sex_label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Hombres, Mujeres]
      - name: age_band
        tests: [not_null]
      - name: address_is_street_level
        description: "true when the Callejero declares that the street has no numbering (TINUM='0')."
        tests: [not_null]

  - name: fact_price_snapshot
    description: >
      Grain (snapshot_date, wh, source_product_id). SNAPSHOT, not DAILY: there are gaps the
      source does not allow recovering. The presence of the row IS the assortment.
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: wh
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: wh
      - name: source_product_id
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: currency
        description: >
          A consumer PREMISE, not source data: Mercadona declares a currency in no
          field. It comes from the dbt_project `currency` var and travels with the number so that
          nobody has to guess when looking at a dashboard.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [EUR]
      - name: product_sk
        description: >
          Points to the VERSION in effect on the snapshot day, not the current one — it is what links an
          old price to the name the product had at the time.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk

  - name: fact_price_change
    description: >
      Grain (snapshot_date, previous_snapshot_date, wh, source_product_id). A
      TRANSITION fact. previous_snapshot_date is the previous EXISTING partition, not "yesterday".
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: previous_snapshot_date
        tests: [not_null]
      - name: days_between_snapshots
        description: >
          Without this column, a change over 8 days would be compared with one over 1 day
          without anyone noticing. The 08-16 to 08-24 gap is real and unrecoverable.
        tests: [not_null]
      - name: purchasable_unit_price
        description: >
          The price "the change" refers to. Equal to unit_price/previous_unit_price
          everywhere, except on the ~10 `bunch` product x warehouse combinations, where unit_price is
          the weight selector's ceiling (see fact_price_snapshot.purchasable_unit_price and
          DECISIONS.md, "Demand calibration against MAPA 2025"). Whoever measures price movement or
          promotions uses purchasable_price_delta/_pct, never the raw price_delta/_pct. NULL on
          `saiu` rows (there is no current price), the same rule as `unit_price`.
      - name: change_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [entrou, saiu, preco_alterado, estavel]

  - name: fact_ingestion_run
    description: >
      Grain (source_name, ingestion_date, wh). Distinguishes "there was no price" from "there was no
      observation". 24 rows; without them every time series silently interpolates.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: complete
        tests:
          - accepted_values:
              arguments:
                values: [true]
                quote: false
      - name: is_valid_observation
        tests: [not_null]
      - name: duration_seconds
        description: >
          CR-005: promoted from Silver, where it already existed. Zero nulls across the 90 historical
          partitions measured (mercadona + oltp + orders) in the review that added this
          column.
        tests: [not_null]
      - name: started_at_utc
        tests: [not_null]
      - name: finished_at_utc
        tests: [not_null]

  - name: fact_population_municipality
    description: >
      Grain (province_code, municipality_code, sex_label, year), 1996-2025. A FACT, not a
      dimension: an additive time series that serves as a denominator. Without the 'Total' aggregate.
    columns:
      - name: sex_label
        description: >
          The source's 'Total' aggregate does NOT come in: summing the three labels would give double the
          population. The same trap as age_label, which in Phase 1 inflated the pyramid by 2.03x.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Hombres, Mujeres]
      - name: year
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]

  - name: fact_order
    description: >
      ACCUMULATING SNAPSHOT. Grain order_id. One row per order that
      fills in as it progresses: eleven milestones and the durations between them. It is the pattern that
      only exists because there are events — a state snapshot would say WHERE the order is,
      never HOW LONG it took to get there. NULL on a milestone means "not reached",
      never "unknown"; is_terminal distinguishes "will never happen" from "not yet".
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: date_key
        tests: [not_null]
      - name: wh
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mad1, bcn1, svq1, vlc1]
      - name: customer_sk
        description: >
          DIM_CUSTOMER version in effect on the order date. It is the repo's first fact to
          resolve an SCD2 by interval — until here the two versioned dimensions did not
          have any fact pointing to a version.
        tests: [not_null]
      - name: geography_sk
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PLACED, CONFIRMED, PAYMENT_FAILED, CANCELLED, PICKING, PICKED,
                         IN_TRANSIT, DELIVERED, DELIVERY_FAILED, RETURNED]
      - name: placed_at
        description: "The only milestone every order has: without it there is no order."
        tests: [not_null]
      - name: gross_amount_placed
        tests: [not_null]
      - name: net_amount
        description: >
          NULL for the 298 orders that died before picking. Null here means
          "nobody computed it", and filling it with the placed value was a real defect,
          fixed in Milestone 4.
      - name: currency
        description: "A consumer premise, not source data. It travels with the number."
        tests: [not_null]
      - name: line_count_placed
        tests: [not_null]

  - name: fact_order_item
    description: >
      Grain (order_id, line_no) — 120,693 rows. Carries the ORDERED and the FULFILLED product
      side by side, each resolved to the DIM_PRODUCT version in effect at price_as_of.
      unit_price_paid is a DEGENERATE MEASURE: price varies by warehouse and by day, so it could
      never be an attribute of a global product dimension.
    columns:
      - name: order_id
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: line_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [placed, fulfilled, substituted, removed, not_picked]
      - name: product_sk
        description: "Version in effect at price_as_of of the ORDERED product."
        tests: [not_null]
      - name: unit_price_paid
        description: >
          Price of the FULFILLED product — the substitute's on the 4,670 substituted lines.
          Closes against FACT_PRICE_SNAPSHOT on 112,864 of 112,864 lines (measured).
      - name: line_amount
        description: "Zero, never null, for a removed or never-picked line."
        tests: [not_null]
      - name: quantity
        tests: [not_null]

  - name: fact_order_event
    description: >
      TRANSACTIONAL FACT, grain event_id — 44,456 rows. It keeps the events that do not fit
      in a milestone column because they occur N times per order: 4,670 substitutions and 2,321
      line removals. Two dates, and the difference is measured: date_key is the ORDER day
      (partition axis), event_date_key is the day the event OCCURRED — they diverge on
      4,567 of the 44,456, and 1,156 events occur outside the order window.
    columns:
      - name: event_id
        description: "sha256(order_id|sequence_no)[:32] — deterministic, never uuid4."
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: sequence_no
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [order_placed, order_payment_authorized, order_payment_failed,
                         order_cancelled, order_picking_started, order_line_substituted,
                         order_line_removed, order_picked, order_dispatched,
                         order_delivered, order_delivery_failed, order_returned]
      - name: date_key
        tests: [not_null]
      - name: event_date_key
        tests: [not_null]
      - name: payload
        description: >
          The event body, typed as VARIANT here and carried as VARCHAR through
          STAGE. try_parse_json and not parse_json: a malformed row becomes a visible null,
          and the not_null below is what guarantees that "visible" does not depend on someone looking.
        tests: [not_null]

  - name: fact_order_premise
    description: >
      The 30 DECLARED premises the generator consumed. Metadata promoted to a fact for the
      same reason as FACT_INGESTION_RUN: without it the downstream mart has no way to be
      honest. MART_FULFILLMENT_SLA measures against the sla_minutes_picking FROM HERE, which is the same
      number as the seed whose sha256 is in the manifest of every RAW partition.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: premise_value
        tests: [not_null]
      - name: premise_label
        description: >
          Always 'synthetic'. 'proxy' would be a lie: a proxy is measured elsewhere and
          used here; these numbers are not measured anywhere.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]

  - name: fact_stock_ledger
    description: >
      PERIODIC SNAPSHOT — the warehouse's third fact pattern. FACT_ORDER_EVENT is
      transactional (one row per event), FACT_ORDER is accumulating (one row that
      fills in), and this one is the state of a shelf on a day. Grain (stock_date, wh,
      source_product_id), with a row even on days without sales — which is where replenishment
      arrives.

      TYPE: synthetic (the cover policy) over observed (consumption, which came from the
      orders, which came from the real catalog). No source in this project measures stock: the
      ledger is COMPUTED by a Spark job, and `written_by` = 'spark' travels all the way here.

      THE WINDOW IS ONE DAY LONGER than FACT_ORDER's because consumption is dated by PICKING,
      and an order placed late on the last day is picked the next day.
    columns:
      - name: date_key
        tests: [not_null]
      - name: stock_date
        tests: [not_null]
      - name: wh
        description: >
          DIM_WAREHOUSE's natural key, no surrogate: the warehouse does not version and `wh` is a
          real parameter of the Mercadona API.
        tests: [not_null]
      - name: source_product_id
        tests: [not_null]
      - name: product_sk
        description: >
          Product version IN EFFECT ON THE DATE of the balance, resolved by range join as
          FACT_ORDER_ITEM does. Pointing to the current version would make the first day's balance
          carry the last day's attribute.
      - name: opening_balance
        description: >
          SEMI-ADDITIVE: sums across products and warehouses, does NOT sum across days. Summing Monday's
          balance with Tuesday's counts the same stock twice.
        tests: [not_null]
      - name: closing_balance
        description: "SEMI-ADDITIVE, same caveat as opening_balance. Never negative."
        tests: [not_null]
      - name: units_short
        description: >
          STOCKOUT, additive. What demand asked for and the shelf did not have. It never became a negative
          balance — the invariant is checked in Silver, before reaching here.
        tests: [not_null]
      - name: days_of_cover
        description: >
          NOT ADDITIVE on any axis: it is a ratio. Its average over products is an average of
          ratios, not the ratio of the sums — MART_STOCK_HEALTH publishes both readings side by
          side precisely because the difference confuses.
      - name: written_by
        description: >
          PROVENANCE all the way to Gold. Always 'spark': it is how a query to the warehouse finds out
          that there is a writer outside Python in the lakehouse.
        tests:
          - not_null
          - accepted_values: {arguments: {values: [spark]}}
