version: 2

# THE BOUNDARY BETWEEN THE TWO ENGINES IS PHYSICAL, AND THIS IS ITS DECLARATION.
#
# No model in this tree may `ref()` a Silver model: different adapters do not
# cross within one dbt run. The link is `source()` over the tables COPY INTO
# loaded — exactly the same mechanism that separates a FROZEN Source from the platform one
# level up, where the two sides only share files.
#
# A practical consequence not to forget: adding a column to a Silver model does NOT make it
# show up here. It must go through the cut (SPECS in warehouse_cut.py) and be reloaded.
# That is a feature, not friction: what crosses the boundary is an explicit decision.

sources:
  - name: stage
    # SNOWFLAKE HAS THREE LEVELS (database.schema.table) AND POSTGRES ONLY TWO: a Postgres
    # connection cannot see ANOTHER database ("cross-database references are not implemented",
    # measured) — only the schema within the current database. `target.database` resolves to the
    # active profile's `dbname` (STAGE already lives there, see postgres_load.py), while
    # Snowflake stays explicit as RETAIL. Without this `{{ }}`, `--target postgres` failed
    # on the TEN warehouse models that read STAGE — the only one left was dim_date, which
    # reads no source at all.
    database: "{{ 'RETAIL' if target.type == 'snowflake' else target.database }}"
    schema: STAGE
    description: >
      A 1:1 mirror of the Silver cut — 406,855 rows, 9.95% of Silver's 4,087,507.
      No business rule: geographic scope filter, latest-ingestion filter and
      grain deduplication, nothing else. Full refresh on every load.
    tables:
      - name: STG_PRODUCT_PRICE
        description: "Grain (ingestion_date, warehouse, source_product_id). The presence of the row IS the assortment."
      - name: STG_PRICE_CHANGE
        description: "Transition between EXISTING snapshots. Carries name_seen_before, an input to the SCD2."
      - name: STG_POPULATION_MUNICIPALITY
        description: "Grain (municipality, sex, year), 1996-2025. Without the source's 'Total' aggregate."
      - name: STG_CATEGORY
        description: "2-level tree, global — identical across the 4 warehouses (measured)."
      - name: STG_CUSTOMER
        description: "All ingestion_dates: DIM_CUSTOMER is SCD2 and needs the history."
      - name: STG_GEOGRAPHY
        description: "Grain (province, municipality, postal code). 699 rows distilled from 304,952 street segments."
      - name: STG_SERVICE_AREA
        description: "Each warehouse's Functional Urban Area: 370 municipalities."
      - name: STG_WAREHOUSE
        description: "The 4 warehouses and their home province."
      - name: STG_INGESTION_RUN
        description: >
          38 rows that distinguish "there was no price" from "there was no observation". Without them
          any time series silently interpolates the gaps. The three sources with a
          warehouse axis come in through `union all by name`; orders declares EVENTS, and the
          mapping to `declared_rows` respects that: the manifest declares EVENTS, and the
          fold declares ORDERS — two different numbers for the same partition.
      - name: STG_ORDER
        description: >
          The fold, grain order_id — one row per order in the window. No latest-ingestion
          filter: each ingestion_date is a day of operation, not a re-ingestion.
      - name: STG_ORDER_LINE
        description: >
          Grain (order_id, line_no). Carries the ORDERED product and the
          FULFILLED product side by side; without both the substitution would disappear.
      - name: STG_ORDER_EVENT
        description: >
          The whole log, grain event_id. The only STAGE table with a
          semi-structured body (`payload_json`, VARCHAR): it is the ORIGIN of the fold, loaded so
          that auditing does not need to go back to RAW.
      - name: STG_ORDER_PREMISE
        description: >
          The declared premises the generator consumed, all labeled 'synthetic'.
          They exist here so that MART_FULFILLMENT_SLA measures against the SAME threshold that
          produced the durations, instead of against a copy of the number — a copy that
          really went stale in Phase 7, when the threshold dropped from 90 to 60.
      - name: STG_STOCK_PREMISE
        description: >
          The stock policy: opening cover, reorder point, target level and supplier
          lead time. All 'synthetic'. Separate from STG_ORDER_PREMISE because it governs
          another domain — those say what a customer DOES, these what the warehouse HAS.
      - name: STG_STOCK_LEDGER
        description: >
          THE STOCK BALANCE, grain (wh, source_product_id, stock_date). The only STAGE
          table that does not come from a Source: stock is not observed anywhere in this
          project, and this ledger is COMPUTED by a Spark job from the consumption measured
          in orders plus the declared policy. `written_by` = 'spark' travels along so
          that whoever queries the warehouse finds this out without opening documentation.

          THE WINDOW IS ONE DAY LONGER than STG_ORDER's, and the difference is real: consumption is
          dated by PICKING, and an order placed late on the last day is picked the next
          day. Making the two equal would require discarding observed consumption.
