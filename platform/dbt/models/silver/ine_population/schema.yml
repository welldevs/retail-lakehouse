version: 2

models:
  - name: silver_ine_population_series
    description: >
      INE population series by province (Tempus3, table_id 31304), projected with no
      interpretation beyond splitting territory/age/sex, which the source concatenates in
      "Nombre". GRAIN: (ingestion_date, table_id, series_code, year, fk_periodo) — each
      series has 2 points per year (fk_periodo 26 and 27), not 1. No manifest reconciliation
      test (parallel to assert_silver_reconciles_with_manifest): this source's extraction
      is a handful of deterministic GETs, not a scrape prone to partial failure
      under rate limiting like Mercadona — disproportionate for now.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: table_id
        description: Extracted from the file name (tables/table_id=<id>.json), not from a hive partition.
        tests: [not_null]
      - name: series_code
        description: "The source's 'COD'. Stable within a table_id."
        tests: [not_null]
      - name: series_name
        tests: [not_null]
      - name: province_name
        description: >
          Territory identified in series_name by VOCABULARY (a closed list of 52
          provinces, or the literal value "Total Nacional" for the whole-country aggregate)
          — not by a fixed position within series_name, which varies (see the model
          comment). "Total Nacional" is not a real province: a future join by province
          name ignores it on its own, without needing an explicit filter.
        tests: [not_null]
      - name: age_label
        description: >
          Age band identified in series_name by elimination (the segment that is neither
          province_name nor sex_label). "Total" means all ages aggregated.
        tests: [not_null]
      - name: sex_label
        description: "One of 'Ambos sexos', 'Hombres', 'Mujeres', identified in series_name by vocabulary."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Ambos sexos", "Hombres", "Mujeres"]
      - name: year
        tests: [not_null]
      - name: fk_periodo
        description: >
          The source's period code. Measured: 27 = reference 30/06, 26 = reference
          31/12 — INE publishes two population estimates per year. Part of the grain:
          without it, (series_code, year) repeats.
        tests: [not_null]
      - name: reference_date
        description: "Reference date of the point, derived from the source's 'Fecha' (epoch ms)."
        tests: [not_null]
      - name: fk_tipo_dato
        description: >
          The source's data type code (e.g. final vs. provisional). Exposed as
          the source declares it — the exact meaning of each value is not documented
          in the public API, so it is not decoded here.
      - name: population_value
        description: "The source's 'Valor'. May be null — the source's CONTRACT.md does not guarantee a filled point."

  - name: silver_ine_population_by_municipality
    description: >
      INE population series by municipality (Tempus3, table_id 29005), projected with no
      interpretation beyond splitting municipality/sex (which the source concatenates in "Nombre")
      and resolving the municipality code via ine_municipality_codes_seed. GRAIN:
      (ingestion_date, series_code, year, fk_periodo). Scoped to this platform's 4 provinces
      (08/28/41/46) by INNER JOIN with the seed — see the model comment.
      The municipality name is NOT a safe key: the RAW side is national and has homonyms in
      other provinces with identical "Nombre". Series with ambiguous names are disambiguated
      by INE's official code in ine_ambiguous_series_seed; the invariant "one series
      per (municipality, sex, year)" is guaranteed by
      assert_ine_population_by_municipality_has_one_series_per_municipality.
      No age: this table only has sex. The age band remains only in
      silver_ine_population_series (province level) — see ARCHITECTURE.md for the
      decision not to pursue a municipality+age table in this phase.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: series_code
        description: "The source's 'COD'. Stable within the table_id."
        tests: [not_null]
      - name: series_name
        tests: [not_null]
      - name: province_code
        description: Resolved via ine_municipality_codes_seed — it does not come from the source.
        tests: [not_null]
      - name: municipality_code
        description: Resolved via ine_municipality_codes_seed — it does not come from the source.
        tests: [not_null]
      - name: municipality_name
        description: >
          Segment 1 of series_name, Tempus3 spelling — it does NOT match the
          Callejero spelling (see ine_municipality_codes_seed).
        tests: [not_null]
      - name: sex_label
        description: >
          Segment 2 of series_name. The source's vocabulary: 'Total'/'Hombres'/'Mujeres'
          — different from 'Ambos sexos' used in silver_ine_population_series (a distinct
          source, not normalized between the two).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Total", "Hombres", "Mujeres"]
      - name: year
        tests: [not_null]
      - name: fk_periodo
        description: "The source's period code. The only value measured in this table: 28."
        tests: [not_null]
      - name: reference_date
        description: "Reference date of the point, derived from the source's 'Fecha' (epoch ms)."
        tests: [not_null]
      - name: is_secret
        description: >
          The source's 'Secreto', exposed without transformation. Not observed as true in
          any point of the measured sample (not an exhaustive sample of the ~8,200
          municipalities) — if true shows up, the consumer should treat population_value with
          caution; this model does not decide that for them.
        tests: [not_null]
      - name: population_value
        description: "The source's 'Valor', without transformation."
