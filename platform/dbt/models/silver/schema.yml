version: 2

models:
  - name: warehouse_province_map
    description: >
      Pass-through of the warehouse_province_map_seed seed to object storage — just a
      "select *". It exists because retail_platform query (connect_lakehouse) never reads
      a native table of the local .duckdb, only parquet under s3://.../silver/; without this model
      the seed loads in dbt build but stays invisible to any query made the
      way the rest of the platform queries Silver. The columns and the content
      tests (not_null, unique) are already on the seed — here it only guarantees that the pass-through
      preserves the grain.
    columns:
      - name: wh
        tests: [not_null, unique]

  - name: warehouse_service_area
    description: >
      Pass-through of the warehouse_service_area_seed seed to object storage — same
      mechanism as warehouse_province_map. GRAIN: (wh, province_code,
      municipality_code). Municipalities of each warehouse's Functional Urban Area (INE),
      within the provinces already landed by the Callejero (08/28/41/46) — Madrid/Barcelona
      border municipalities stay out, see scripts/derive_warehouse_service_area.py.
    columns:
      - name: wh
        tests: [not_null]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: is_home_municipality
        tests: [not_null]

  - name: customer_premises
    description: >
      Pass-through of the customer_premises_seed seed to object storage — same mechanism as
      order_premises. GRAIN: premise_key. The 4 DECLARED premises that govern who EXISTS
      as an account holder: minimum age, where the penetration rate comes from, which population
      is its denominator and how the count is split across warehouses. A domain separate from
      order_premises on purpose — those govern what a customer DOES, these govern
      who they are. Phase 5 went wrong by not having the separation: it treated "a newborn cannot
      buy" as an order rule and the base kept 18.01% minors.
      The only observed thing at play, e-commerce's 2.2% of food volume, is NOT
      here: customer_penetration_source points to demand_profile.channel_reference_pct,
      where it was measured. That is why `label` is 'synthetic' on all four rows.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        description: >
          Always 'synthetic'. The four rows are this platform's decision; the measurement
          one of them uses lives in another seed and is pointed to by name, never copied.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]

  - name: stock_premises
    description: >
      Pass-through of the stock_premises_seed seed to object storage. GRAIN: premise_key. The stock
      POLICY: how many days to cover, when to replenish, up to where, and the supplier lead
      time. All 'synthetic' — no source in this repository measures stock, and that
      absence is the reason the domain waited until Phase 7.

      WHAT IS NOT SYNTHETIC is the number they multiply: the average daily demand per
      series comes from consumption MEASURED in silver_order_line. The structure comes from the data, the policy
      comes from here, and the two stay distinguishable — the same shape as the customer base anchored
      on INE population.

      Separate from order_premises because it governs another domain: those say what a
      customer DOES, these what the warehouse HAS. Merging them would make every order regeneration
      look like a stock policy change.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]

  - name: order_premises
    description: >
      Pass-through of the order_premises_seed seed to object storage — same mechanism as
      warehouse_service_area. GRAIN: premise_key. The DECLARED premises the order
      generator consumed: cadence, basket, exception rates, durations between milestones and the SLA
      threshold. None is observed — no source in this repo measures basket, cadence or
      availability — which is why `label` is 'synthetic' on every row, tested with
      accepted_values and not by convention. It crosses the boundary to the warehouse so that
      MART_FULFILLMENT_SLA compares against the SAME threshold the generator used, instead of
      against a copy of the number — a copy that really went stale in Phase 7, when the
      threshold dropped from 90 to 60.

      SOME ARE DERIVED from the others, and assert_order_premises_are_internally_coherent
      checks the derivation: the customer cadence reproduces daily_order_rate, the share
      vectors sum to 1, the delivery window holds a slot, and sla_minutes_picking comes from
      sla_picking_percentile over the basket's triangular (CR-017).
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        description: >
          Always 'synthetic'. `proxy` would be a lie: a proxy is measured elsewhere and
          used here; these numbers are not measured anywhere.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]
