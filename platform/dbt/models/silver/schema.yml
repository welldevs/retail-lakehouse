version: 2

models:
  - name: warehouse_province_map
    description: >
      Passagem do seed warehouse_province_map_seed para o object storage — so um
      "select *". Existe porque retail_platform query (connect_lakehouse) nunca le
      tabela nativa do .duckdb local, so parquet sob s3://.../silver/; sem este modelo
      o seed carrega no dbt build mas fica invisivel pra qualquer consulta feita do
      jeito que o resto da plataforma consulta o Silver. As colunas e os testes de
      conteudo (not_null, unique) ja estao no seed — aqui so garante que a passagem
      preserva o grao.
    columns:
      - name: wh
        tests: [not_null, unique]

  - name: warehouse_service_area
    description: >
      Passagem do seed warehouse_service_area_seed para o object storage — mesmo
      mecanismo de warehouse_province_map. GRAO: (wh, province_code,
      municipality_code). Municipios da Area Urbana Funcional (INE) de cada warehouse,
      dentro das provincias ja landadas pelo Callejero (08/28/41/46) — municipios de
      fronteira de Madrid/Barcelona ficam fora, ver scripts/derive_warehouse_service_area.py.
    columns:
      - name: wh
        tests: [not_null]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: is_home_municipality
        tests: [not_null]

  - name: customer_premises
    description: >
      Passagem do seed customer_premises_seed para o object storage — mesmo mecanismo de
      order_premises. GRAO: premise_key. As 4 premissas DECLARADAS que governam quem EXISTE
      como titular de conta: idade minima, de onde vem a taxa de penetracao, qual populacao
      e o denominador dela e como a contagem se reparte entre armazens. Dominio separado do
      de order_premises de proposito — aquelas governam o que um cliente FAZ, estas governam
      quem ele e. A Fase 5 errou por nao ter a separacao: tratou "recem-nascido nao pode
      comprar" como regra de pedido e a base seguiu com 18,01% de menores.
      A unica coisa observada em jogo, os 2,2% do e-commerce no volume de alimentacao, NAO
      esta aqui: customer_penetration_source aponta para demand_profile.channel_reference_pct,
      onde ela foi medida. Por isso `label` e 'synthetic' nas quatro linhas.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        description: >
          Sempre 'synthetic'. As quatro linhas sao decisao desta plataforma; a medicao que
          uma delas usa mora em outro seed e e apontada por nome, nunca copiada.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]

  - name: stock_premises
    description: >
      Passagem do seed stock_premises_seed para o object storage. GRAO: premise_key. A
      POLITICA de estoque: quantos dias cobrir, quando repor, ate onde, e o prazo do
      fornecedor. Todas 'synthetic' — nenhuma fonte deste repositorio mede estoque, e essa
      ausencia e a razao de o dominio ter esperado ate a Fase 7.

      O QUE NAO E SINTETICO e o numero que elas multiplicam: a demanda media diaria por
      serie vem do consumo MEDIDO em silver_order_line. A estrutura vem do dado, a politica
      vem daqui, e as duas ficam distinguiveis — mesma forma da base de clientes ancorada
      na populacao do INE.

      Separada de order_premises porque governa outro dominio: aquelas dizem o que um
      cliente FAZ, estas o que o armazem TEM. Junta-las faria toda regeracao de pedidos
      parecer mudanca de politica de estoque.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]

  - name: order_premises
    description: >
      Passagem do seed order_premises_seed para o object storage — mesmo mecanismo de
      warehouse_service_area. GRAO: premise_key. As premissas DECLARADAS que o gerador de
      pedidos consumiu: cadencia, cesta, taxas de excecao, duracoes entre marcos e o limiar
      de SLA. Nenhuma e observada — nenhuma fonte deste repo mede cesta, cadencia ou
      disponibilidade — e por isso `label` e 'synthetic' em todas as linhas, testado com
      accepted_values e nao por convencao. Atravessa a fronteira ate o warehouse para que
      MART_FULFILLMENT_SLA compare contra o MESMO limiar que o gerador usou, em vez de
      contra uma copia do numero — copia que envelheceu de verdade na Fase 7, quando o
      limiar caiu de 90 para 60.

      TRES DELAS SAO DERIVADAS das outras, e assert_order_premises_are_internally_coherent
      afere a derivacao: slot_lead_hours_min/max saem do ciclo declarado, e
      sla_minutes_picking sai de sla_picking_percentile sobre a triangular da cesta.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        description: >
          Sempre 'synthetic'. `proxy` seria mentira: um proxy e medido em outro lugar e
          usado aqui; estes numeros nao sao medidos em lugar nenhum.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [synthetic]
      - name: rationale
        tests: [not_null]
