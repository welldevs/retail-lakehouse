version: 2

models:
  - name: silver_order_event
    description: >
      GRAIN (event_id). Faithful projection of the order event log: typed envelope, payload
      preserved as JSON. Each row is an immutable event; the order's state does not live here,
      it is the fold, and it lives in silver_order.

      `ingestion_date` is the ORDER DATE, not the event's — every event of an order stays in the
      partition of the day it was placed, even when crossing midnight. Measured on the
      2026-08-24 to 08-27 window: 4,567 of 44,456 events (10.3%) occur after
      midnight of the order day. That is why `event_date` exists alongside, and `crosses_order_date`
      flags the case.

      The payload crosses as JSON and not as a STRUCT on purpose: letting DuckDB infer
      produces the union of the fields of the 12 types, and that union depends on what sampling saw.
      A day without returns would have no `returned_amount` and a downstream model would stop
      compiling by chance.
    columns:
      - name: event_id
        description: sha256(order_id|sequence_no), truncated to 32. Deterministic by contract.
        tests: [not_null, unique]
      - name: event_type
        description: One of the 12 types of the contract's closed vocabulary.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - order_placed
                  - order_payment_authorized
                  - order_payment_failed
                  - order_cancelled
                  - order_picking_started
                  - order_line_substituted
                  - order_line_removed
                  - order_picked
                  - order_dispatched
                  - order_delivered
                  - order_delivery_failed
                  - order_returned
      - name: event_version
        description: Payload schema version. A new version requires a new reader.
        tests:
          - not_null
          - accepted_values: {arguments: {values: [1], quote: false}}
      - name: order_id
        description: The event's aggregate, and the broker's partition key one level further on.
        tests: [not_null]
      - name: sequence_no
        description: Position within the aggregate, 1..N with no gaps. The only total order within the order.
        tests: [not_null]
      - name: occurred_at
        description: Instant of the event in UTC. Derived from the partition date, never from the clock.
        tests: [not_null]
      - name: event_date
        description: Day the event occurred. May be later than ingestion_date.
        tests: [not_null]
      - name: crosses_order_date
        description: True when the event occurred after midnight of the order day.
        tests: [not_null]
      - name: ingestion_date
        description: ORDER DAY. It is not the event date — see the model description.
        tests: [not_null]
      - name: wh
        tests:
          - not_null
          - accepted_values: {arguments: {values: [mad1, bcn1, svq1, vlc1]}}
      - name: partition_wh
        description: The partition's hive axis, extracted from the filename so it can be reconciled.
        tests: [not_null]
      - name: producer
        tests:
          - not_null
          - accepted_values: {arguments: {values: [simulated_orders]}}
      - name: payload
        description: The event payload, verbatim. Its shape depends on event_type.
        tests: [not_null]

  - name: silver_order
    description: >
      GRAIN (order_id). THE FOLD: state and measures of each order, derived from the log. There is no
      state written in RAW — two representations of the same truth diverge, so the state
      lives here and is always rebuildable.

      The fold is NON-TRIVIAL, and that is what justifies the event model: `net_amount` is not
      derivable from `gross_amount_placed`, because line substitution and removal change the
      basket after placement. Measured on the window: 108,194 lines fulfilled unchanged,
      4,670 substituted (+10,318.99) and 2,321 removed (-15,153.72).

      `net_amount` is null for an order that never reached picking (payment refusal,
      cancellation). Null here means "there was no picking", not "unknown".
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: ingestion_date
        description: ORDER DAY.
        tests: [not_null]
      - name: wh
        tests:
          - not_null
          - accepted_values: {arguments: {values: [mad1, bcn1, svq1, vlc1]}}
      - name: customer_id
        description: The order's customer. Always a customer of the same warehouse.
        tests: [not_null]
      - name: customer_ingestion_date
        description: Customer generation in effect on the order date. Feeds the Gold SCD2.
        tests: [not_null]
      - name: buyer_age_band
        description: >
          The buyer's age band AT THE TIME OF THE ORDER, stamped on the event by the Source.
          It is what chose the per-cohort weight vector that drew this basket. It comes from the
          payload and not from a join with silver_customer: deriving it today would give today's band,
          and reimplementing the boundaries in SQL would create a second definition that would diverge from the
          first at the first adjustment.
        tests:
          - not_null
          - accepted_values: {arguments: {values: ['LT35', '35_49', '50_64', 'GE65']}}
      - name: price_as_of
        description: Catalog snapshot that backs this order's price.
        tests: [not_null]
      - name: price_source
        description: >
          `observed` when price_as_of is the day itself; `carried_forward` when the day had no
          snapshot for that warehouse and the last known price was carried forward.
          Comparing revenue across days without looking at this column compares different vintages.
        tests:
          - not_null
          - accepted_values: {arguments: {values: [observed, carried_forward]}}
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [PLACED, CONFIRMED, PICKING, PICKED, IN_TRANSIT, DELIVERED,
                   PAYMENT_FAILED, CANCELLED, DELIVERY_FAILED, RETURNED]
      - name: is_terminal
        description: >
          DELIVERED is not terminal: a return may still come after it, which is why
          it does not close the aggregate.
        tests: [not_null]
      - name: placed_at
        tests: [not_null]
      - name: line_count_placed
        tests: [not_null]
      - name: gross_amount_placed
        description: Sum of the PLACED lines, before any change at picking.
        tests: [not_null]
      - name: substituted_lines
        tests: [not_null]
      - name: removed_lines
        tests: [not_null]
      - name: event_count
        tests: [not_null]
      - name: lifecycle_minutes
        description: Minutes between placement and the order's last event.
        tests: [not_null]

  - name: silver_order_line
    description: >
      GRAIN (order_id, line_no). Final state of each line, after substitutions and
      removals. `line_no` is the position in the placed basket and is never reused.

      The PLACED line and the FINAL line coexist: `source_product_id` is what the customer ordered,
      `fulfilled_source_product_id` is what they received. Keeping only the second would erase the
      substitution, which is the fact the event model exists to record.

      `line_amount` is zero for a removed line, so that the per-order sum closes with
      `silver_order.net_amount` without any consumer-side filter.

      MIND THIS WHEN MEASURING AVERAGE VALUE. The source's `unit_price` spans four orders of magnitude:
      frozen seafood and Iberian ham sold by weight reach 3,663.00 against a
      median of 2.25. Measured: 9 of the 4,670 substitutions landed above 100.00 and account
      for 42% of the substituted value. An arithmetic mean of basket value is dominated by a handful
      of lines — use the median or a percentile, or declare the tail.
    columns:
      - name: demand_group
        description: >
          Demand group the basket was calibrated against (MAPA 2025). Stamped on the
          event by the Source and resolved by the platform against
          demand_category_mapping_seed.csv — it comes from the EVENT and not from a join with the catalog,
          because what matters is the group that held at the time of the order. The stamp's stability
          within the window has its own test in
          tests/assert_demand_group_is_stable_across_the_window.sql.
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: line_status
        description: >
          FINAL state of the line. `fulfilled` requires the order to have reached picking
          (`order_picked`); `not_picked` is the line of an order that died before that —
          cancelled or with payment refused. `placed` is an order still in flight, which does not
          occur in this window. Until Milestone 4 the first three did not exist and everything that was
          not substituted or removed became `fulfilled`, asserting picking on 5,508
          lines of 298 orders that were never picked.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [placed, fulfilled, substituted, removed, not_picked]
      - name: source_product_id
        description: What the customer ORDERED. Always a product from that wh's catalog on that date.
        tests: [not_null]
      - name: fulfilled_source_product_id
        description: >
          What the customer RECEIVED. Null when the line was removed OR when the order never
          reached picking — null here means "does not exist", not "unknown".
      - name: quantity
        tests: [not_null]
      - name: unit_price
        description: Observed unit price of the ordered product, at that warehouse and date.
        tests: [not_null]
      - name: line_amount
        description: >
          The line's effective contribution. Zero for a removed line and for a line of an order that
          was never picked. The ORDERED value stays in line_amount_placed, alongside.
        tests: [not_null]
      - name: line_amount_placed
        description: The line's contribution as placed, before picking.
        tests: [not_null]
      - name: price_source
        tests:
          - not_null
          - accepted_values: {arguments: {values: [observed, carried_forward]}}
      - name: wh
        tests:
          - not_null
          - accepted_values: {arguments: {values: [mad1, bcn1, svq1, vlc1]}}
      - name: ingestion_date
        tests: [not_null]
      - name: removal_reason
        description: >
          `unavailable`, and never `out_of_stock`: there is no stock fact in this platform,
          and naming it as if there were would promise data nobody measured.
        tests:
          - accepted_values: {arguments: {values: [unavailable]}}

  - name: silver_orders_manifest
    description: >
      GRAIN (ingestion_date, wh). The manifest as a table. Sibling of raw_manifest and
      silver_oltp_manifest.

      Here it declares the FOLD — order_rows, net_amount_picked, substituted_lines — numbers that
      only exist after folding the log. The Source computed them in Python; Silver recomputes them
      in SQL. The test that crosses the two closes manifest -> RAW -> parquet along independent
      paths.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: ingestion_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: source_warehouse
        description: The warehouse according to the MANIFEST, to be compared with the partition axis.
        tests: [not_null]
      - name: source_name
        tests:
          - not_null
          - accepted_values: {arguments: {values: [simulated_orders]}}
      - name: complete
        tests:
          - not_null
          - accepted_values: {arguments: {values: [true], quote: false}}
      - name: failure_count
        tests:
          - not_null
          - accepted_values: {arguments: {values: [0], quote: false}}
      - name: seed
        tests: [not_null]
      - name: premises_sha256
        description: >
          Digest of the premises table that generated this partition. Changing a rate and regenerating
          would change the orders under the same order_ids; without this field that would leave no trace.
        tests: [not_null]
      - name: price_source
        tests:
          - not_null
          - accepted_values: {arguments: {values: [observed, carried_forward]}}
      - name: declared_event_rows
        tests: [not_null]
      - name: declared_order_rows
        tests: [not_null]
      - name: declared_line_rows
        tests: [not_null]
      - name: declared_substituted_lines
        tests: [not_null]
      - name: declared_removed_lines
        tests: [not_null]
      - name: declared_gross_amount_placed
        tests: [not_null]
      - name: schema_fingerprint
        tests: [not_null]

  - name: silver_live_order_state
    description: >
      THE LIVE PROJECTION, read from the Iceberg table that two processes write: the streaming
      consumer (`orders-project --sink iceberg`) and the batch rebuild
      (`orders-rebuild-projection`). Grain: order_id, the same as silver_order.

      It exists ONLY so that the reconciliation between the two paths is a query and not
      a loose script. It adds no fact to the Lakehouse.

      It stays out of `dbt build` while the Iceberg table does not exist, through the same
      `has-data` guard as the other sources. The metadata path comes from the var
      `live_order_state_metadata`, resolved in the catalog by `make silver`: DuckDB refuses to
      guess which metadata is current, and its refusal is right.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PLACED, CONFIRMED, PICKING, PICKED, IN_TRANSIT, DELIVERED,
                         PAYMENT_FAILED, CANCELLED, DELIVERY_FAILED, RETURNED]
      - name: last_sequence_no
        description: >
          Last applied event. It is the guard that makes the merge between the two writers
          MONOTONIC: a write that does not advance this column is discarded, otherwise a retry
          could write an old state over a newer one and the table would regress without anything failing.
        tests: [not_null]
      - name: written_by
        description: >
          PROVENANCE: which of the two writers touched the row last. Without it, "both
          writers wrote" would be a claim about a log, not a queryable fact.
        tests:
          - not_null
          - accepted_values: {arguments: {values: [stream, rebuild]}}
      - name: net_amount
        description: >
          Null for an order that never reached picking — the same discipline as silver_order
          and the OLTP. Filling it with the placed value would make the column answer another question
          under the same name.

  - name: silver_stock_ledger
    description: >
      THE STOCK BALANCE, read from the Iceberg table SPARK writes — the catalog's third writer
      and the first outside Python. GRAIN: (wh, source_product_id, stock_date),
      one row per series per day of the window, including days without sales: without them the balance
      would skip precisely the days on which a replenishment arrives.

      THE ONLY SILVER MODEL THAT DOES NOT DERIVE FROM A SOURCE. Stock is not observed anywhere
      in this project; the ledger is COMPUTED from the consumption observed in orders
      plus the policy declared in stock_premises. Consumption counts the DELIVERED product (a
      substituted line takes from the substitute's stock), at the time of PICKING, and ignores
      removed lines and orders that were never picked.

      WHY SPARK. The shape: it is a running sum whose INPUTS are generated by decisions
      taken from its own state — a low balance issues an order, the order arrives days
      later and changes the next balance. A window function reads the partition but does not write back
      into it. Measured in check_spark_iceberg S7b: the SQL running sum diverges on 14 of
      the case's 30 days and reaches a balance of -70. It was NOT about volume: the volume trigger did not
      fire in this project, and that is measured.

      IT STAYS OUT OF THE BUILD WHILE THE TABLE DOES NOT EXIST, through silver_gate's gate. It is not
      fault tolerance: it is what keeps Spark OPTIONAL — a fresh clone builds the whole
      Silver without a JVM.

      DECLARED LIMIT: this ledger's stockout is independent of the generator's `removal_rate_*`,
      which produces "unavailable" lines at a fixed rate without looking at the balance. Neither causes the other.
      Making them coherent would require the generator to READ the ledger, inverting the project's
      dependency. Trigger: a second-pass generator.
    columns:
      - name: wh
        tests: [not_null]
      - name: source_product_id
        tests: [not_null]
      - name: stock_date
        tests: [not_null]
      - name: opening_balance
        tests: [not_null]
      - name: closing_balance
        description: >
          Balance at the end of the day. Never negative: what demand asked for and the shelf did not
          have becomes units_short. A negative balance would close the sum and lie about the stock.
        tests: [not_null]
      - name: units_short
        description: >
          STOCKOUT. It can only be greater than zero with closing_balance = 0 — and
          assert_stock_ledger_conserves_the_balance checks that, because a job that
          ignored the demand that does not fit would conserve the balance and report zero stockout
          forever.
        tests: [not_null]
      - name: reorder_units
        description: >
          Replenishment is an ENTRY in this table, not a separate table: the grain is already the day, and
          an orders table alongside would require joining the two for any balance
          question.
        tests: [not_null]
      - name: reorder_eta
        description: >
          stock_date + supplier_lead_days, and
          assert_stock_replenishment_respects_the_lead_time checks it. Null when there was no
          order.
      - name: mean_daily_demand
        description: >
          OBSERVED: total consumed by the series divided by the days of the WINDOW — not by the
          days with sales. Dividing by the days with sales would measure "how much goes out when it goes out", and a
          product sold once in nine days would get the same stock as one sold every
          day.
        tests: [not_null]
      - name: written_by
        description: >
          PROVENANCE. Always 'spark' in this table, and it is worth it anyway: it is how a
          query finds out that there is a writer outside Python in the catalog — the
          property that justified Iceberg and that was only claimed.
        tests:
          - not_null
          - accepted_values: {arguments: {values: [spark]}}
