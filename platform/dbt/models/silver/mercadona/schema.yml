version: 2

models:
  - name: raw_manifest
    description: >
      The Source's _manifest.json as a modeled source. It exists so that the reconciliation
      between what the Source declared and what Silver produced is a TEST, and not a
      loose script. See tests/assert_silver_reconciles_with_manifest.sql.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: warehouse
        tests: [not_null]
      - name: run_id
        tests: [not_null, unique]
      - name: complete
        description: The platform only consumes complete partitions; false here is an ingestion error.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
      - name: failure_count
        description: Contract guarantee 16 — a recorded failure fails the partition.
        tests:
          - accepted_values:
              arguments:
                values: [0]
                quote: false
      - name: declared_product_rows
        tests: [not_null]
      - name: schema_fingerprint
        tests: [not_null]

  - name: silver_category
    description: "Flattened category tree: level 1 (26) > level 2 (151), per partition."
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: warehouse
        tests: [not_null]
      - name: category_id
        description: Level-2 id. Unique within the partition.
        tests: [not_null]
      - name: category_name
        tests: [not_null]
      - name: parent_category_id
        description: Level 1. Not accessible through the API (404/410); it only exists in this tree.
        tests: [not_null]
      - name: parent_category_name
        tests: [not_null]

  - name: silver_product_price
    description: >
      Faithful, typed projection of each snapshot. GRAIN:
      (ingestion_date, warehouse, category_id, subgroup_id, source_product_id).
      It is NOT source_product_id — CONTRACT.md 4.8: the product repeats across categories and
      subgroups, ~270 rows per partition. The grain uniqueness is in
      tests/assert_product_price_grain_is_unique.sql.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: warehouse
        tests: [not_null]
      - name: category_id
        tests: [not_null]
      - name: subgroup_id
        tests: [not_null]
      - name: source_product_id
        description: >
          SOURCE KEY (CONTRACT.md 4.5), not a business identity. A string, not an
          integer. Consistent within a snapshot; no guarantee across snapshots.
        tests: [not_null]
      - name: display_name
        description: Does NOT identify the product — names repeat across formats, with different prices.
        tests: [not_null]
      - name: unit_price
        description: >
          DECIMAL(10,2). Comes as a string from the source; converting to float would lose precision.
          IT IS NOT ALWAYS THE PRICE OF A PURCHASABLE UNIT — see price_basis and
          purchasable_unit_price. Preserved as the source returned it, on purpose.
        tests: [not_null]
      - name: price_basis
        description: >
          How this row's price is formed, MEASURED at the source (CONTRACT.md 4.5):
          `bunch` = selling_method 1 with null unit_size, where
          unit_price = reference_price * 99 and is NOT usable (105 rows);
          `piece` = whole piece, unit_price = reference_price * unit_size, a legitimate price;
          `unit` = consumer package, the normal case.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unit', 'piece', 'bunch']
      - name: purchasable_unit_price
        description: >
          Price of the purchasable portion. Equal to unit_price everywhere except on `bunch` rows,
          where it is reference_price * min_bunch_amount — two observed fields, no
          estimate. Measured: max 5.55 on `bunch` against the source unit_price's 3,663.00.
          The anchor has its own test in
          tests/assert_purchasable_price_is_anchored_in_the_bunch_amount.sql.
        tests: [not_null]
      - name: purchasable_unit_size
        description: >
          Size of the purchasable portion in reference_format. min_bunch_amount on
          `bunch` rows, the source's unit_size elsewhere (null when the source does not declare it).
      - name: min_bunch_amount
        description: >
          Minimum portion of the weight selector, in reference_format. It had always been in RAW and
          this model discarded it — and it was the only path to a purchasable price on
          loose-item rows. No re-ingestion was needed to bring it in.
      - name: net_content_kg_l
        description: >
          Content of the purchasable portion in kg or litres, derived from
          purchasable_unit_price / reference_price. NULL ON PURPOSE when
          reference_format is neither mass nor volume (`ud`, `dz`, `lv`, `dc`, `m`): converting
          eggs to kg would require a weight per egg that no source in this repo measures.
          Coverage measured on 2026-08-31: 83.3% of rows.
      - name: tax_percentage
        description: The populated field. `iva` is null in 100% of rows and was not projected.
        tests: [not_null]
      - name: price_decreased
        description: >
          Preserved for fidelity, but FALSE in 100% of rows across the three partitions
          while 152 prices changed. It does not serve to detect changes — which is why
          silver_price_change exists.

  - name: silver_price_change
    description: >
      The only model that crosses dates. It compares each partition with the PREVIOUS EXISTING one
      (lag over the partition sequence, not date arithmetic), which keeps it
      correct across the 8-day gap between 08-16 and 08-24.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: previous_ingestion_date
        description: Never null — each warehouse's first partition is excluded for having no predecessor.
        tests: [not_null]
      - name: source_product_id
        tests: [not_null]
      - name: purchasable_unit_price
        description: >
          The price comparable across partitions — equal to unit_price everywhere, except on
          `bunch` rows (see purchasable_unit_price in silver_product_price). change_type
          and the purchasable_* deltas compare this column, never the raw unit_price. NULL
          on `saiu` rows (there is no current price), the same rule as `unit_price`.
      - name: change_type
        description: >
          Classified against purchasable_unit_price, not the raw unit_price — "the price
          changed" must mean that, not "the weight selector's ceiling changed".
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['entrou', 'saiu', 'preco_alterado', 'estavel']
      - name: name_seen_before
        description: >
          BUSINESS IDENTITY TRAP. A new id whose display_name already existed in the
          previous partition. The source does not say whether it is the same item re-keyed or an item
          withdrawn and another launched; these cases are a review queue, not a "new product".
        tests: [not_null]
