version: 2

models:
  - name: silver_customer
    description: >
      Synthetic customers anchored on REAL Callejero geography. The customer is invented;
      the place where they live is not. Grain (ingestion_date, customer_id) — the same ids
      coexist on different dates, because each regeneration of the base creates a new
      ingestion_date.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on the most recent ingestion_date. The history of all generations is
          preserved on purpose — it is what lets you see the base grow — so without the
          filter customers from different generations add up. `where is_latest_ingestion` reads
          the current base.
        tests: [not_null]
      - name: wh
        description: >
          Warehouse, in the source's own vocabulary. Kept instead of renamed to
          `warehouse`: that is what warehouse_service_area and warehouse_province_map
          call it, and those are what this model joins with.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mad1, bcn1, svq1, vlc1]
      - name: partition_wh
        description: >
          The path's `wh=` axis, extracted from the filename. It exists only to be reconciled
          with `wh` — the two have the same name in read_json and DuckDB deduplicates them, so
          without this column a partition landed under the wrong directory would have nothing to
          be compared with. See tests/assert_customer_partition_axis_matches_record.sql.
        tests: [not_null]
      - name: customer_id
        description: >
          cust_<wh>_<6-digit index>. Unique within an ingestion_date (the wh is
          embedded in the id), NOT across dates. It is not a persistent identity: it is a partition
          key — CONTRACT.md section 3, guarantee 3.
        tests: [not_null]
      - name: province_code
        tests: [not_null]
      - name: province_name
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: municipality_name
        description: >
          INE 29005 spelling (`Bruc, El`), NOT the Callejero's (`BRUC (EL)`). Measured: the
          two diverge in 370 of 370 municipalities. What is compared between the two sources is
          always the CODE, never the name.
        tests: [not_null]
      - name: candidate_index
        description: >
          Audit, not a foreign key: points to the exact row of address_candidates.json
          in the export identified in silver_oltp_manifest.reference_path. That file is an
          ephemeral generator input and is not landed in RAW.
        tests: [not_null]
      - name: street_name
        tests: [not_null]
      - name: postal_code
        description: The segment's real postal code (Callejero CPOS field). Never invented.
        tests: [not_null]
      - name: numbering_type
        description: >
          Verbatim from the Callejero (TINUM field). "0" = the street has no numbering scheme,
          "1" = odd numbers, "2" = even numbers. Carried through to the customer so that the numbering rule
          is auditable by looking at this model alone.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["0", "1", "2"]
      - name: house_number
        description: >
          A number within the segment's real range, respecting parity — or NULL when
          no number exists. NULL is never bare here: it is always qualified by the
          numbering_type next to it. See
          tests/assert_customer_house_number_matches_numbering_type.sql.
      - name: first_name
        tests: [not_null]
      - name: last_name
        tests: [not_null]
      - name: sex_label
        description: >
          EXACT label from INE table 29005, where the proportion came from — hence
          "Hombres"/"Mujeres" and not "M"/"F". The source's "Total" aggregate is never sampled.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Hombres, Mujeres]
      - name: birth_year
        description: >
          Derived: year(ingestion_date) minus the sampled age. Regenerating the base on another
          date shifts this field and preserves the age — see age_at_ingestion.
        tests: [not_null]
      - name: age_at_ingestion
        description: >
          The age the generator actually drew, recovered exactly (not approximated).
          It is the demographic attribute that is stable across generations. A PROVINCIAL distribution used
          as a proxy: there is no age band per municipality in the tables ingested by this
          platform.
        tests: [not_null]

  - name: silver_oltp_manifest
    description: >
      The OLTP source's _manifest.json as a modeled source. Besides the reconciliation that
      raw_manifest.sql does for Mercadona, it carries the INPUT LINEAGE: which
      Callejero and which population these customers were derived from. This is the repo's only derived
      source, so that question can only be answered here.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: wh
        tests: [not_null]
      - name: run_id
        tests: [not_null, unique]
      - name: complete
        description: The platform only consumes complete partitions; false here is an ingestion error.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
      - name: source_warehouse
        description: >
          The wh the Source wrote in the manifest. Reconciled against the partition's hive axis
          by the coherence test, the same pattern as raw_manifest.
        tests: [not_null]
      - name: failure_count
        description: A recorded failure fails the partition.
        tests:
          - accepted_values:
              arguments:
                values: [0]
                quote: false
      - name: seed
        description: >
          The seed that reproduces this partition. Together with reference_path, ingestion_date and the
          register's scope (min_customer_age, penetration_pct, allocation_rule), they are the
          FOUR conditions of the reproducibility guarantee.
        tests: [not_null]
      - name: count_source
        description: >
          'reference' when the base size came from that warehouse's adult population,
          'cli' when someone passed --count. Without this column, a base generated with a manual
          override would be indistinguishable from one derived from population.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reference, cli]
      - name: min_customer_age
        description: >
          Minimum age to exist as an account holder, read from the reference. It is not the
          same as order_premises.min_buyer_age: that one governs who MAY ORDER, this one
          governs who EXISTS. Phase 5 confused the two and the base kept 18.01%
          minors.
        tests: [not_null]
      - name: penetration_pct
        description: >
          The rate that sized the base, as a percentage of the adult population served. It travels
          here for the same reason as the seed: changing it swaps the people behind the same ids.
        tests: [not_null]
      - name: allocation_rule
        tests: [not_null]
      - name: customer_target
        description: >
          How many customers the reference asked for this warehouse. Next to
          requested_count it answers "is the base the size the population asked for?" without
          redoing the calculation.
        tests: [not_null]
      - name: declared_customer_rows
        tests: [not_null]
      - name: callejero_ingestion_date
        description: Lineage — which Callejero extraction the addresses came from.
        tests: [not_null]
      - name: population_ingestion_date
        description: Lineage — which extraction of table 29005 the municipal weight came from.
        tests: [not_null]
      - name: population_series_ingestion_date
        description: Lineage — which extraction of table 31304 the age pyramid came from.
        tests: [not_null]
      - name: previous_runs
        description: >
          How many previous runs this partition accumulated via --overwrite. Each one
          keeps its seed and its count, so that a regeneration with another seed does not swap the
          people behind the same ids without leaving a trace.
        tests: [not_null]
      - name: schema_fingerprint
        tests: [not_null]
