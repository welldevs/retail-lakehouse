version: 2

models:
  - name: silver_callejero_sections
    description: >
      Secoes censitarias do INE (arquivo SECC do Callejero), projetadas sem
      interpretacao alem de decompor o codigo. GRAO: (ingestion_date, section_code).
      Layout medido, nao documentado oficialmente — ver CONTRACT.md da source
      (sources/ine-callejero-source), secao 2.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        description: Nome original do arquivo do INE (ex. SECC.P28.D260630.G260702) — proveniencia.
        tests: [not_null]
      - name: section_code
        description: Codigo de 10 digitos, provincia+municipio+distrito+secao concatenados.
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: district_code
        tests: [not_null]
      - name: section_number
        tests: [not_null]

  - name: silver_callejero_population_units
    description: >
      Unidades populacionais/nucleos do INE (arquivo UP do Callejero). GRAO:
      (ingestion_date, unit_code). is_municipality_aggregate=true e a linha do
      MUNICIPIO inteiro, nao de um nucleo especifico dentro dele.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: unit_code
        description: Codigo de 12 digitos, provincia+municipio+sufixo de entidade.
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: entity_suffix
        tests: [not_null]
      - name: is_municipality_aggregate
        tests: [not_null]
      - name: reference_date
        description: Data de referencia do Callejero (do proprio arquivo, nao ingestion_date).
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: population_unit_name
        description: >
          Nome do nucleo/entidade dentro do municipio: pedania/aldeia historicamente
          anexada (ex. Valencia tem 16 nomeadas — BENIFARAIG, PINEDO, EL SALER...) ou
          "*DISEMINADO*" para populacao dispersa fora de qualquer nucleo. NAO e bairro
          administrativo (tipo Chamberi/Retiro em Madrid) — esse conceito pertence a
          prefeitura de cada cidade, nao ao nomenclator do INE, e nao esta em nenhum dos
          4 arquivos desta source. Medido: Madrid, Barcelona e Sevilla capital sao UMA
          entidade unica sem subdivisao no UP (so retornam o proprio nome do municipio);
          Valencia e a unica dos 4 warehouses com pedanias nomeadas, por ter anexado
          varios nucleos historicamente (L'Horta). Vazio quando a linha e so o registro
          "container" do nucleo (sufixo terminado em 00, sem *DISEMINADO*/nome proprio).
        tests: [not_null]

  - name: silver_callejero_streets
    description: >
      Ruas do INE (arquivo VIAS do Callejero). GRAO: (ingestion_date, street_code).
      Validado contra enderecos reais (Alcala/Madrid, Gran Via em 3 municipios) — ver
      CONTRACT.md da source.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: street_code
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: street_id
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
      - name: street_type
        description: "Abreviatura do tipo de logradouro (CALLE, PLAZA, CMNO, PRAJE, ...)."
        tests: [not_null]
      - name: street_name_short
        tests: [not_null]
      - name: street_name_full
        tests: [not_null]
      - name: street_name_alt
        tests: [not_null]

  - name: silver_callejero_pseudo_addresses
    description: >
      Pseudovias do INE (arquivo PSEU do Callejero): pontos enderecaveis fora de rua
      convencional (caixas de correio, estacionamentos, conjuntos de edificios). GRAO:
      (ingestion_date, pseudo_address_code). Nao e auxiliar de silver_callejero_streets
      — identidades e codigos proprios, sem correspondencia 1:1 com rua.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: pseudo_address_code
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: pseudo_address_id
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
      - name: name_short
        tests: [not_null]
      - name: name_full
        tests: [not_null]

  - name: silver_callejero_tramos
    description: >
      Tramos de via do INE (arquivo TRAM do Callejero): a unica das 4 tabelas que liga
      secao + entidade/nucleo + via/pseudovia + CODIGO POSTAL + faixa de numeracao num
      so registro. GRAO composto (sem coluna unica de id do tramo nos bytes) — ver
      assert_callejero_tramos_grain_is_unique.sql. street_code/pseudo_address_code sao
      reconstruidos para JOIN com silver_callejero_streets/pseudo_addresses; unit_code
      para JOIN com silver_callejero_population_units. "00000" em street_id/
      pseudo_address_id significa "nao se aplica" (sao mutuamente exclusivos).
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: section_code
        description: Codigo de secao censitaria (mesmo formato de silver_callejero_sections.section_code).
        tests: [not_null]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: district_code
        tests: [not_null]
      - name: section_number
        tests: [not_null]
      - name: entity_suffix
        tests: [not_null]
      - name: unit_code
        description: >
          provincia+municipio+entity_suffix — chave de JOIN com
          silver_callejero_population_units.unit_code.
        tests: [not_null]
      - name: street_id
        description: '"00000" quando o tramo pertence a uma pseudovia, nao a uma via.'
        tests: [not_null]
      - name: street_code
        description: >
          provincia+municipio+street_id — chave de JOIN com
          silver_callejero_streets.street_code (so bate quando street_id != "00000").
        tests: [not_null]
      - name: pseudo_address_id
        description: '"00000" quando o tramo pertence a uma via, nao a uma pseudovia.'
        tests: [not_null]
      - name: pseudo_address_code
        description: >
          provincia+municipio+pseudo_address_id — chave de JOIN com
          silver_callejero_pseudo_addresses.pseudo_address_code (so bate quando
          pseudo_address_id != "00000").
        tests: [not_null]
      - name: postal_code
        description: >
          CEP (CPOS no layout oficial). Unico dos 4 datasets do Callejero com codigo
          postal. Validado: sempre com o prefixo correto da provincia em 305.361/305.408
          linhas reais (99,985%); as poucas excecoes ocorrem so em Barcelona.
        tests: [not_null]
      - name: numbering_type
        description: '"0"=sem numeracao, "1"=impar, "2"=par (TINUM no layout oficial).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["0", "1", "2"]
      - name: number_from
        tests: [not_null]
      - name: number_to
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
