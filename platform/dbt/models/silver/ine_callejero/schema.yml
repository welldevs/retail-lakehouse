version: 2

models:
  - name: silver_callejero_sections
    description: >
      INE census sections (the Callejero SECC file), projected with no
      interpretation beyond decomposing the code. GRAIN: (ingestion_date, section_code).
      Layout measured, not officially documented — see the source's CONTRACT.md
      (sources/ine-callejero-source), section 2.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        description: Original INE file name (e.g. SECC.P28.D260630.G260702) — provenance.
        tests: [not_null]
      - name: section_code
        description: 10-digit code, province+municipality+district+section concatenated.
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: district_code
        tests: [not_null]
      - name: section_number
        tests: [not_null]

  - name: silver_callejero_population_units
    description: >
      INE population units/nuclei (the Callejero UP file). GRAIN:
      (ingestion_date, unit_code). is_municipality_aggregate=true is the row of the whole
      MUNICIPALITY, not of a specific nucleus within it.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: unit_code
        description: 12-digit code, province+municipality+entity suffix.
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: entity_suffix
        tests: [not_null]
      - name: is_municipality_aggregate
        tests: [not_null]
      - name: reference_date
        description: Callejero reference date (from the file itself, not ingestion_date).
        tests: [not_null]
      - name: municipality_name
        tests: [not_null]
      - name: population_unit_name
        description: >
          Name of the nucleus/entity within the municipality: a historically annexed hamlet/village
          (e.g. Valencia has 16 named ones — BENIFARAIG, PINEDO, EL SALER...) or
          "*DISEMINADO*" for scattered population outside any nucleus. It is NOT an administrative
          neighborhood (like Chamberi/Retiro in Madrid) — that concept belongs to each city's
          council, not to the INE gazetteer, and it is not in any of this source's
          4 files. Measured: Madrid, Barcelona and Sevilla city are ONE single
          entity with no subdivision in UP (they only return the municipality's own name);
          Valencia is the only one of the 4 warehouses with named hamlets, having annexed
          several nuclei historically (L'Horta). Empty when the row is just the nucleus's
          "container" record (suffix ending in 00, with no *DISEMINADO*/proper name).
        tests: [not_null]

  - name: silver_callejero_streets
    description: >
      INE streets (the Callejero VIAS file). GRAIN: (ingestion_date, street_code).
      Validated against real addresses (Alcala/Madrid, Gran Via in 3 municipalities) — see
      the source's CONTRACT.md.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: street_code
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: street_id
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
      - name: street_type
        description: "Abbreviation of the street type (CALLE, PLAZA, CMNO, PRAJE, ...)."
        tests: [not_null]
      - name: street_name_short
        tests: [not_null]
      - name: street_name_full
        tests: [not_null]
      - name: street_name_alt
        tests: [not_null]

  - name: silver_callejero_pseudo_addresses
    description: >
      INE pseudo-streets (the Callejero PSEU file): addressable points outside a conventional
      street (mailboxes, car parks, building complexes). GRAIN:
      (ingestion_date, pseudo_address_code). It is not an auxiliary of silver_callejero_streets
      — its own identities and codes, with no 1:1 correspondence to a street.
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: pseudo_address_code
        tests: [not_null, unique]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: pseudo_address_id
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
      - name: name_short
        tests: [not_null]
      - name: name_full
        tests: [not_null]

  - name: silver_callejero_tramos
    description: >
      INE street segments (the Callejero TRAM file): the only one of the 4 tables that links
      section + entity/nucleus + street/pseudo-street + POSTAL CODE + numbering range in
      a single record. Composite GRAIN (no single segment-id column in the bytes) — see
      assert_callejero_tramos_grain_is_unique.sql. street_code/pseudo_address_code are
      rebuilt for a JOIN with silver_callejero_streets/pseudo_addresses; unit_code
      for a JOIN with silver_callejero_population_units. "00000" in street_id/
      pseudo_address_id means "not applicable" (they are mutually exclusive).
    columns:
      - name: ingestion_date
        tests: [not_null]
      - name: is_latest_ingestion
        description: >
          true on this model's most recent ingestion_date. The history of all
          extractions is preserved on purpose, so a re-extraction of the SAME INE
          publication stacks equivalent rows — `where is_latest_ingestion` reads the current
          state; without the filter, the whole history is read and the count doubles.
        tests: [not_null]
      - name: source_dataset
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: section_code
        description: Census section code (same format as silver_callejero_sections.section_code).
        tests: [not_null]
      - name: province_code
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: district_code
        tests: [not_null]
      - name: section_number
        tests: [not_null]
      - name: entity_suffix
        tests: [not_null]
      - name: unit_code
        description: >
          province+municipality+entity_suffix — JOIN key with
          silver_callejero_population_units.unit_code.
        tests: [not_null]
      - name: street_id
        description: '"00000" when the segment belongs to a pseudo-street, not a street.'
        tests: [not_null]
      - name: street_code
        description: >
          province+municipality+street_id — JOIN key with
          silver_callejero_streets.street_code (only matches when street_id != "00000").
        tests: [not_null]
      - name: pseudo_address_id
        description: '"00000" when the segment belongs to a street, not a pseudo-street.'
        tests: [not_null]
      - name: pseudo_address_code
        description: >
          province+municipality+pseudo_address_id — JOIN key with
          silver_callejero_pseudo_addresses.pseudo_address_code (only matches when
          pseudo_address_id != "00000").
        tests: [not_null]
      - name: postal_code
        description: >
          Postal code (CPOS in the official layout). The only one of the 4 Callejero datasets with a postal
          code. Validated: always with the right province prefix in 305,361/305,408
          real rows (99.985%); the few exceptions occur only in Barcelona.
        tests: [not_null]
      - name: numbering_type
        description: '"0"=no numbering, "1"=odd, "2"=even (TINUM in the official layout).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["0", "1", "2"]
      - name: number_from
        tests: [not_null]
      - name: number_to
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
