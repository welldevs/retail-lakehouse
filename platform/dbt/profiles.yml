# Local profile. Credentials come from the environment (.env at the repo root), never from
# this file.
#
# s3_endpoint in DuckDB is host:port WITHOUT a scheme, and MinIO requires url_style=path
# (virtual-host style would require DNS per bucket).
retail_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'retail.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - json
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT_HOST', 'localhost:9000') }}"
        # With a default: without it dbt aborts with "Env var required but not provided",
        # which does not say which variable nor where to define it. The development value
        # in .env.example is the same, so the default does not hide a wrong configuration —
        # it only makes the error readable when .env was not created.
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minioadmin') }}"
        s3_use_ssl: false
        s3_url_style: "path"

    # SECOND TARGET, same project. The models/silver/ tree only exists when
    # target.type == 'duckdb' and models/warehouse/ only when in ('snowflake', 'postgres')
    # (guard in dbt_project.yml), so a warehouse build never tries to run a read_json over
    # s3:// inside the destination.
    #
    # The boundary between the two trees is PHYSICAL, not logical: a warehouse model reads
    # `source()` over the STAGE tables that COPY INTO loaded, never `ref()` of a Silver
    # model. Different adapters do not cross in one run — the same discipline that
    # separates Source from platform, one level up.
    #
    # KEY-PAIR AUTHENTICATION, not password: it is the method Snowflake recommends for
    # programmatic access and the only one that works for a DAG. The private key lives
    # outside the repo (~/.snowflake/keys/), with mode 600; only the PATH travels here.
    snowflake:
      type: snowflake
      # NO DEFAULT, on purpose — unlike MinIO above. `minioadmin` is a local convention
      # that .env.example repeats, so the default hides nothing. A Snowflake ACCOUNT has no
      # equivalent: any value hard-coded here is a specific person's account, and whoever
      # cloned the repo without configuring anything would not get "configure the
      # account" — they would get a connection attempt against someone else's account,
      # failing with "Object does not exist" far away from the cause. When absent, dbt
      # aborts naming the variable. See .env.snowflake.example.
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # RETAIL_TRANSFORMER, not ACCOUNTADMIN: dbt READS STAGE and WRITES GOLD and MART, and
      # that is exactly what the role grants. Running the transformation as administrator
      # would make the three roles decorative — they would exist, be verified, and no real
      # run would go through them.
      role: "{{ env_var('SNOWFLAKE_ROLE', 'RETAIL_TRANSFORMER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.snowflake/keys/spark_retail_rsa.p8') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'RETAIL') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      # dbt's DEFAULT schema is GOLD; MART overrides it through the project's `+schema`.
      schema: GOLD
      threads: 4
      client_session_keep_alive: false

    # THIRD TARGET, same `target.type` guard as the warehouse (dbt_project.yml now accepts
    # 'snowflake' OR 'postgres'). It exists because the Snowflake account above is a TRIAL,
    # with an expiry date: this target proves, with an engine that does not expire, that
    # the models/warehouse/ tree can also switch ENGINE — not just account. See DECISIONS.md.
    #
    # WITH DEFAULTS, unlike Snowflake: there is no "someone else's account" to protect
    # here. `localhost:5434/retail` is the project's own convention, the same way
    # MINIO_ROOT_USER above has a default — this target's Postgres runs in the compose
    # container `warehouse-postgres`, under an opt-in profile, and does not exist outside
    # local development.
    postgres:
      type: postgres
      host: "{{ env_var('WAREHOUSE_PG_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PG_PORT', '5434') | int }}"
      user: "{{ env_var('WAREHOUSE_PG_USER', 'retail') }}"
      password: "{{ env_var('WAREHOUSE_PG_PASSWORD', 'retail') }}"
      dbname: "{{ env_var('WAREHOUSE_PG_DB', 'retail') }}"
      # SAME REASON as the `role` of the snowflake target above: without this dbt runs as
      # `retail` (the container superuser, the one that LOGs IN) and every GOLD/MART table
      # would be born owned by IT, not by `retail_transformer` — the `alter default
      # privileges for role retail_transformer ...` that `bootstrap()` creates
      # (postgres_load.py) would never fire, and `retail_reader` (the dashboard) would have
      # no select on ANY new table. Measured: with this field absent, `select` on
      # MART.mart_order_funnel as retail_reader returned "permission denied for table
      # mart_order_funnel" even after the bootstrap and a clean `dbt build`. dbt-postgres
      # runs `set role` right after connecting (see dbt/adapters/postgres/connections.py) —
      # `retail` is a superuser and can assume any role without first requiring a
      # membership GRANT.
      role: "{{ env_var('WAREHOUSE_PG_ROLE', 'retail_transformer') }}"
      schema: gold
      threads: 4
