version: 2

# LANGUAGE OF THE SEED FILES. Descriptions in this file are English, like the rest of the
# project (CR-014). The `rationale`/`note`/`label` text INSIDE some CSVs is still Portuguese
# (customer_premises, order_premises, demand_profile, demand_seasonality,
# demand_category_mapping, demand_cohort_age/region, mapa_2025_benchmark/region), and a few
# place names are accent-stripped Spanish. That is a declared exception, not an oversight:
# the generators hash each seed byte for byte (`seed_sha256`, `demand_seeds_sha256`) into
# every partition manifest and into the capture seal, so translating a single character
# changes the hashes and forces regenerating customers and orders. A translation is a
# change request of its own, with `make freeze` after it.

seeds:
  - name: warehouse_province_map_seed
    description: >
      Map wh -> province/municipality, with official INE codes. Derived from the
      INE Callejero (no API, downloaded by hand from the website, twice a year) — see
      scripts/derive_warehouse_province_map.py for the derivation/re-check (it crosses
      UP against SECC; the raw Callejero files are not kept in the repo, only the
      result, here). province_name uses the SAME spelling as
      silver_ine_population_series.province_name (e.g. "Valencia/València"), for a direct
      join without text normalization.

      Name with the _seed suffix on purpose: there is also a MODEL called
      warehouse_province_map (models/silver/warehouse_province_map.sql) that is just a
      "select *" of this seed, materialized in object storage — it is that model, not this
      seed, that shows up in `retail_platform query` (see the model comment).
    columns:
      - name: wh
        description: Warehouse code, as it appears in silver_product_price.warehouse.
        tests: [not_null, unique]
      - name: province_code
        description: INE province code (2 digits, zero-padded).
        tests: [not_null]
      - name: province_name
        description: >
          Spelling identical to silver_ine_population_series.province_name — direct join
          without normalizing text.
        tests: [not_null]
      - name: municipio_code
        description: INE municipality code (3 digits, zero-padded).
        tests: [not_null]
      - name: municipio_name
        tests: [not_null]

  - name: ine_municipality_codes_seed
    description: >
      INE code (province+municipality) of each municipality within this
      platform's scope (08/28/41/46), derived live from VALORES_VARIABLE/19 of INE's Tempus3
      API — see scripts/derive_municipality_codes.py for the derivation and the reason
      (DATOS_TABLA/29005, population by municipality, only has the municipality NAME in
      "Nombre", never the code). municipality_name uses the Tempus3 spelling (same as
      silver_ine_population_by_municipality.municipality_name), DIFFERENT from the
      Callejero spelling (uppercase, article as suffix) — it is not the same text as
      silver_callejero_population_units.municipality_name, and a join by name between the two
      would break.
    columns:
      - name: province_code
        description: INE province code (2 digits, zero-padded).
        tests: [not_null]
      - name: municipality_code
        description: INE municipality code (3 digits, zero-padded).
        tests: [not_null]
      - name: municipality_name
        description: >
          Municipality name in the Tempus3 spelling. A safe join key ONLY within
          this seed (scoped to 08/28/41/46) — confirmed that none of the 866 names
          repeats within that scope, although 18 names repeat across all of Spain
          between different provinces (e.g. "Arroyomolinos" in Madrid and Caceres).
        tests: [not_null, unique]

  - name: stock_premises_seed
    description: >
      The stock POLICY, in days of demand: opening cover, reorder point,
      target level and supplier lead time. All 'synthetic' — no source in this repository
      measures stock, and that absence is the reason the domain only exists since Phase 7.

      What is NOT synthetic is the number they multiply: the average daily demand per
      series comes from consumption MEASURED in silver_order_line. The policy comes from here, the scale comes
      from the data. See assert_stock_premises_are_internally_coherent, which crosses them
      against each other — reorder point above the lead time, target level above the point, and opening
      cover above the point.
    columns:
      - name: premise_key
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: rationale
        tests: [not_null]

  - name: frozen_capture_seed
    description: >
      THE CAPTURE SEAL, one row per RAW partition. DERIVED: written by `make freeze`,
      together with docs/FREEZE.md, from the same collection — do not edit by hand.

      `content_sha256` covers the SORTED list of (path, sha256, bytes, records) declared in the
      partition manifest. run_id, timestamps and history are deliberately left out: they are
      RUN metadata, and including them would make a re-land of byte-identical data break the
      seal. An alarm that fires without cause trains reviewers to ignore it — the same reason
      the panel CONTRACT carries the source's sha256 and not the generation date.

      IT MAY BE EMPTY, and empty means "not sealed yet" — the state of a fresh clone.
      assert_raw_matches_the_frozen_capture treats that as nothing to guard; from the
      first seal on it starts enforcing. There is no third state.

      The COMPLETE check is `make freeze-check`, which re-reads the object storage. The dbt test
      covers the part that runs without extra network: a partition landed after closing.
    columns:
      - name: source
        tests: [not_null]
      - name: partition_key
        tests: [not_null]
      - name: content_sha256
        tests: [not_null]

  - name: warehouse_service_area_seed
    description: >
      The municipalities of each warehouse's Functional Urban Area (INE), including the home
      municipality itself (is_home_municipality = true). GRAIN: (wh, province_code,
      municipality_code). Derived and cross-validated against the real Callejero by
      scripts/derive_warehouse_service_area.py. Passed through to object storage by the model
      warehouse_service_area.

  - name: ine_ambiguous_series_seed
    description: >
      Official INE codes (province + municipality) of the population series whose NAME is
      ambiguous across provinces (homonymous municipalities), obtained from the INE API by
      scripts/derive_ambiguous_series.py. Used by silver_ine_population_by_municipality to
      keep only the series that belongs to the municipality in scope.

  - name: ine_ccaa_map_seed
    description: >
      Province to autonomous community (CCAA) map for the provinces in scope. Used to read
      MAPA's regional figures against this platform's warehouses.

  - name: ine_online_propensity_seed
    description: >
      Share of people who bought a physical short-lived product online, by age band and by
      municipality size band (INE TIC-H, table 50116). Observed. The pointer to the table and
      the exact label of each row travel in `ine_table`, `provenance` and `note`.

  - name: customer_premises_seed
    description: >
      The DECLARED premises that govern who EXISTS as an account holder: minimum age, where
      the penetration rate comes from, which population is its denominator and how the count
      is split across warehouses. GRAIN: premise_key. `label` is 'synthetic' on every row.
      Passed through to object storage by the model customer_premises.

  - name: order_premises_seed
    description: >
      The DECLARED premises the order generator consumes: cadence, basket, exception rates,
      durations between milestones and the picking SLA. GRAIN: premise_key. `label` is
      'synthetic' on every row. Passed through to object storage by the model order_premises,
      so the warehouse compares against the SAME threshold the generator used.

  - name: demand_profile_seed
    description: >
      Parameters of the demand model (version, food share of the basket, channel reference
      and others). GRAIN: param_key. `value` is varchar because the column mixes a version, a
      rule name and numbers. Changing a value changes the orders generated behind the same ids.

  - name: demand_seasonality_seed
    description: >
      Monthly seasonality factor of the demand model, one row per calendar month (1-12).
      Declared, not measured: the source publishes the monthly charts as images, so the
      values are not extractable. GRAIN: month.

  - name: demand_category_mapping_seed
    description: >
      Map from the catalog category levels (l1, l2, l3) to a MAPA benchmark key (`mapa_key`);
      `SIN_BENCHMARK` marks the categories the report has no share for. `rationale` explains
      each mapping.

  - name: mapa_2025_benchmark_seed
    description: >
      The MAPA 2025 household food consumption benchmark, one row per `mapa_key`: volume and
      value shares, average price per kg or litre, year-on-year changes and the e-commerce
      share. `informe_section`, `provenance` and `note` carry the traceability to the report.

  - name: mapa_2025_region_seed
    description: >
      MAPA 2025 per-capita consumption by autonomous community (`ccaa_code`); `00` is the
      national average, used as the denominator, not a region. GRAIN: ccaa_code.

  - name: demand_cohort_age_seed
    description: >
      Population share and volume share by age band for each `mapa_key`, with the report pages
      cited in `informe_page`. `provenance` says whether a row is read from the report or
      derived from it.

  - name: demand_cohort_region_seed
    description: >
      Population share and volume share by autonomous community for each `mapa_key`, with the
      report pages cited in `informe_page`. `provenance` says whether a row is read from the
      report or derived from it.
