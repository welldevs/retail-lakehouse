version: 2

seeds:
  - name: warehouse_province_map_seed
    description: >
      Mapa wh -> provincia/municipio, com codigos oficiais do INE. Derivado do
      Callejero do INE (sem API, baixado manualmente do site, semestral) — ver
      scripts/derive_warehouse_province_map.py para a derivacao/reconferencia (cruza
      UP contra SECC; os arquivos brutos do Callejero nao ficam no repo, so o
      resultado, aqui). province_name usa a MESMA grafia de
      silver_ine_population_series.province_name (ex. "Valencia/València"), para join
      direto sem normalizacao de texto.

      Nome com sufixo _seed de proposito: existe tambem um MODELO chamado
      warehouse_province_map (models/silver/warehouse_province_map.sql) que e so um
      "select *" deste seed, materializado no object storage — e esse modelo, nao este
      seed, que aparece em `retail_platform query` (ver comentario do modelo).
    columns:
      - name: wh
        description: Codigo do armazem, como aparece em silver_product_price.warehouse.
        tests: [not_null, unique]
      - name: province_code
        description: Codigo de provincia do INE (2 digitos, com zero a esquerda).
        tests: [not_null]
      - name: province_name
        description: >
          Grafia identica a silver_ine_population_series.province_name — join direto
          sem normalizar texto.
        tests: [not_null]
      - name: municipio_code
        description: Codigo de municipio do INE (3 digitos, com zero a esquerda).
        tests: [not_null]
      - name: municipio_name
        tests: [not_null]

  - name: ine_municipality_codes_seed
    description: >
      Codigo INE (provincia+municipio) de cada municipio dentro do escopo desta
      plataforma (08/28/41/46), derivado ao vivo de VALORES_VARIABLE/19 da API Tempus3
      do INE — ver scripts/derive_municipality_codes.py para a derivacao e o porque
      (DATOS_TABLA/29005, populacao por municipio, so tem o NOME do municipio em
      "Nombre", nunca o codigo). municipality_name usa a grafia do Tempus3 (mesma de
      silver_ine_population_by_municipality.municipality_name), DIFERENTE da grafia do
      Callejero (maiuscula, artigo como sufixo) — nao e o mesmo texto de
      silver_callejero_population_units.municipality_name, join por nome entre os dois
      quebraria.
    columns:
      - name: province_code
        description: Codigo de provincia do INE (2 digitos, com zero a esquerda).
        tests: [not_null]
      - name: municipality_code
        description: Codigo de municipio do INE (3 digitos, com zero a esquerda).
        tests: [not_null]
      - name: municipality_name
        description: >
          Nome do municipio na grafia Tempus3. Chave segura de join SOMENTE dentro
          deste seed (escopado a 08/28/41/46) — confirmado que nenhum dos 866 nomes se
          repete dentro desse escopo, embora 18 nomes se repitam na Espanha inteira
          entre provincias diferentes (ex. "Arroyomolinos" em Madrid e Caceres).
        tests: [not_null, unique]
